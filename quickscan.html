<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenpertise Quick Scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2f6f5e; --primary-dark: #234f42; --bg: #f4f7f6;
    --bot-bubble: #eef3f1; --user-bubble: #2f6f5e; --border: #dbe4e1;
    --green: #2e8b57; --amber: #c98a2c; --red: #c0392b;
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --cream: #f8f3e9; --cream-deep: #f1e9d8;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:#1f2d29; display:flex; justify-content:center; padding:24px; }
  .app { width:100%; max-width:760px; }
  .card { background:white; border-radius:14px; box-shadow:0 2px 14px rgba(0,0,0,0.06); border:1px solid var(--border); overflow:hidden; display:flex; flex-direction:column; }
  .header { background:var(--primary); color:white; padding:16px 20px; position:relative; }
  .header h1 { font-size:17px; margin:0 0 2px; padding-right:34px; }
  .header p { font-size:12.5px; margin:0; opacity:0.9; padding-right:34px; }
  .voice-toggle { position:absolute; top:14px; right:14px; width:28px; height:28px; border-radius:50%; border:1px solid rgba(255,255,255,0.5); background:rgba(255,255,255,0.12); color:white; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .voice-toggle:hover { background:rgba(255,255,255,0.22); }
  .voice-toggle.muted { opacity:0.6; }
  .sector-picker { padding:20px; display:flex; flex-wrap:wrap; gap:10px; }
  .sector-btn { flex:1 1 45%; border:1px solid var(--border); background:white; border-radius:10px; padding:16px 12px; text-align:left; cursor:pointer; font-size:14px; }
  .sector-btn:hover { border-color:var(--primary); background:#eaf3f0; }
  .sector-btn .icon { font-size:22px; display:block; margin-bottom:6px; }
  .sector-btn .name { font-weight:700; display:block; }
  .sector-btn .desc { font-size:12px; color:#667; }
  .messages { flex:1; padding:16px; height:420px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 13px; border-radius:14px; font-size:14px; line-height:1.45; white-space:pre-wrap; }
  .msg.bot { align-self:flex-start; background:var(--bot-bubble); border-bottom-left-radius:4px; }
  .msg.user { align-self:flex-end; background:var(--user-bubble); color:white; border-bottom-right-radius:4px; }
  .msg.perspective { align-self:center; background:#e7edea; color:#234f42; font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:0.04em; padding:6px 14px; border-radius:999px; }
  .progress { padding:0 16px 8px; font-size:11.5px; color:#778; }
  .quick-replies { display:flex; flex-wrap:wrap; gap:8px; padding:0 16px 12px; }
  .quick-replies button { border:1px solid var(--primary); background:white; color:var(--primary); border-radius:999px; padding:7px 13px; font-size:13px; cursor:pointer; }
  .quick-replies button:hover { background:#eaf3f0; }
  .input-row { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border); }
  .input-row input { flex:1; padding:10px 13px; border-radius:10px; border:1px solid var(--border); font-size:14px; }
  .input-row button { background:var(--primary); color:white; border:none; border-radius:10px; padding:0 18px; font-size:14px; cursor:pointer; }
  .input-row button:hover { background:var(--primary-dark); }
  .input-row button.mic-btn { background:white; color:var(--primary); border:1px solid var(--border); padding:0 14px; font-size:16px; }
  .input-row button.mic-btn:hover { background:#eaf3f0; }
  .input-row button.mic-btn.listening { background:var(--red); color:white; border-color:var(--red); animation:mic-pulse 1.2s infinite; }
  @keyframes mic-pulse { 0%{ box-shadow:0 0 0 0 rgba(192,57,43,0.45); } 70%{ box-shadow:0 0 0 9px rgba(192,57,43,0); } 100%{ box-shadow:0 0 0 0 rgba(192,57,43,0); } }
  .mic-hint { padding:0 16px 4px; font-size:11px; color:#c0392b; }

  .report { padding:20px; }
  .report h2 { font-size:16px; margin:0 0 4px; color:var(--primary-dark); }
  .report .sub { font-size:12.5px; color:#667; margin-bottom:16px; }
  .bsc-chart { border:1px solid var(--border); border-radius:12px; padding:10px 8px 4px; margin-bottom:16px; background:white; }

  /* "ZENPERTISE OS"-stijl dashboard rond de BSC-ringgrafiek — premium "Practice Balance
     Scorecard"-uitvoering: warm crème canvas, dieptgroen + goud accent, sierlijke Fraunces-
     display-typografie voor de kop/score, en meer beeldrijkdom in de ringgrafiek (icoon-badges +
     centrale "wave-mesh"-decoratie) zonder de onderliggende datastructuur/HTML-hooks te wijzigen. */
  .zos-dashboard {
    position:relative; overflow:hidden;
    background:
      radial-gradient(circle at 14% 12%, rgba(201,138,44,0.10), transparent 42%),
      radial-gradient(circle at 88% 82%, rgba(35,79,66,0.08), transparent 46%),
      linear-gradient(180deg, var(--cream) 0%, var(--cream-deep) 100%);
    border:1px solid #e6dcc4; border-radius:20px; padding:26px 24px 22px;
    margin-bottom:18px; display:grid; grid-template-columns: 1fr 1.05fr 1fr; gap:22px; align-items:start;
    box-shadow: 0 1px 2px rgba(35,79,66,0.04), 0 10px 30px -18px rgba(35,79,66,0.28);
  }
  .zos-header { grid-column: 1 / -1; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .zos-logo { display:flex; align-items:center; gap:9px; }
  .zos-logo .mark { width:30px; height:30px; flex-shrink:0; }
  .zos-logo .word { line-height:1.12; }
  .zos-logo .word b { display:block; font-family:var(--font-display); font-size:14px; letter-spacing:0.02em; color:var(--primary-dark); font-weight:600; }
  .zos-logo .word span { display:block; font-size:10px; font-weight:800; letter-spacing:0.16em; color:var(--amber); }
  .zos-eyebrow { font-size:10px; font-weight:700; letter-spacing:0.14em; color:#8a7f6f; text-transform:uppercase; white-space:nowrap; border-bottom:2px solid var(--amber); padding-bottom:4px; }
  .zos-col { display:flex; flex-direction:column; gap:13px; min-width:0; position:relative; }
  .zos-headline { font-family:var(--font-display); font-size:23px; line-height:1.22; color:#22322c; margin:3px 0 0; font-weight:600; letter-spacing:-0.005em; }
  .zos-headline em { font-style:normal; color:var(--amber); }
  .zos-sub { font-size:12.5px; line-height:1.55; color:#5a6a63; }
  .zos-sub strong { color:#22322c; }
  .health-card { background:white; border:1px solid #ece3cd; border-radius:14px; padding:14px 16px 15px; box-shadow:0 8px 20px -14px rgba(35,79,66,0.35); }
  .health-card .eyebrow { font-size:9.5px; font-weight:700; letter-spacing:0.12em; color:#8a7f6f; text-transform:uppercase; margin-bottom:5px; }
  .health-card .row { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:4px; }
  .health-card .score { font-family:var(--font-display); font-size:36px; font-weight:600; color:var(--primary-dark); line-height:1; }
  .health-card .score small { font-family:-apple-system,BlinkMacSystemFont,sans-serif; font-size:12.5px; font-weight:600; color:#8a7f6f; }
  .health-card .trend { font-size:10.5px; color:var(--primary-dark); font-weight:700; background:#eef3f1; border-radius:999px; padding:3px 9px; }
  .health-bar { height:7px; border-radius:999px; background:linear-gradient(90deg,#c0392b,#c98a2c,#2e8b57); margin-top:11px; position:relative; box-shadow:inset 0 1px 2px rgba(0,0,0,0.12); }
  .health-bar .dot { position:absolute; top:50%; width:13px; height:13px; border-radius:50%; background:white; border:3px solid var(--primary-dark); transform:translate(-50%,-50%); box-shadow:0 1px 4px rgba(0,0,0,0.25); }
  .health-bar-labels { display:flex; justify-content:space-between; font-size:9px; color:#8a7f6f; margin-top:5px; }
  .zos-quote { font-family:var(--font-display); font-size:12.5px; font-style:italic; color:#5a6a63; border-left:2px solid var(--amber); padding-left:11px; font-weight:500; }
  .zos-chart-col { align-items:center; text-align:center; }
  .priorities-title, .quickwins-title { font-size:10.5px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:#8a7f6f; margin:2px 0 2px; }
  .priority-card { display:flex; align-items:center; gap:11px; background:white; border:1px solid #ece3cd; border-radius:13px; padding:10px 12px; margin-bottom:8px; box-shadow:0 6px 16px -12px rgba(35,79,66,0.35); transition:transform .15s ease; }
  .priority-card .rank-icon { width:33px; height:33px; border-radius:50%; background:#fbe7ce; color:var(--amber); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:inset 0 0 0 1px rgba(201,138,44,0.25); }
  .priority-card .body { flex:1; min-width:0; }
  .priority-card .num { font-size:10px; color:#8a7f6f; font-weight:700; letter-spacing:0.04em; }
  .priority-card .name { font-size:12px; font-weight:700; color:#22322c; }
  .priority-card .val { font-size:14px; font-weight:800; }
  .priority-card .deficit { font-size:10px; color:#8a7f6f; }
  .priority-card .arrow { flex-shrink:0; color:#c3b896; }
  .quickwin-item { display:flex; align-items:flex-start; gap:9px; font-size:12px; padding:5px 0; }
  .quickwin-item .check { width:17px; height:17px; border-radius:50%; background:#e2efe8; color:var(--green); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; box-shadow:inset 0 0 0 1px rgba(46,139,87,0.2); }
  .quickwin-item .qtitle { font-weight:700; color:#22322c; display:block; }
  .quickwin-item .qimpact { font-size:10px; color:#8a7f6f; }
  .zos-footer { grid-column: 1 / -1; display:flex; justify-content:space-between; gap:10px; border-top:1px solid #e6dcc4; padding-top:16px; margin-top:4px; flex-wrap:wrap; }
  .zos-stat { display:flex; align-items:center; gap:9px; flex:1; min-width:130px; }
  .zos-stat .ic { width:30px; height:30px; border-radius:50%; background:white; color:var(--primary-dark); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 4px 10px -6px rgba(35,79,66,0.4), inset 0 0 0 1px #ece3cd; }
  .zos-stat .val { font-family:var(--font-display); font-size:15px; font-weight:600; color:#22322c; line-height:1.15; }
  .zos-stat .lbl { font-size:9.5px; color:#8a7f6f; }
  @media (max-width: 700px) {
    .zos-dashboard { grid-template-columns: 1fr; }
    .zos-footer { flex-direction:column; }
  }

  .score-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:20px; }
  .score-card { border:1px solid var(--border); border-radius:10px; padding:14px; }
  .score-card .persp { font-size:12px; color:#667; text-transform:uppercase; letter-spacing:0.03em; }
  .score-card .badge { display:inline-block; margin-top:6px; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; color:white; }
  .badge.green { background:var(--green); }
  .badge.amber { background:var(--amber); }
  .badge.red { background:var(--red); }
  .improve-list { border-top:1px solid var(--border); padding-top:14px; }
  .improve-list h3 { font-size:14px; margin:0 0 10px; }
  .improve-item { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .improve-item:last-child { border-bottom:none; }
  .improve-item .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; margin-top:4px; }
  .improve-item .dot.amber { background:var(--amber); }
  .improve-item .dot.red { background:var(--red); }
  .improve-item .calc-note { display:block; margin-top:3px; font-size:11.5px; color:#778; font-weight:400; }
  .restart-btn { margin:16px 0 0; background:white; border:1px solid var(--primary); color:var(--primary); border-radius:10px; padding:9px 14px; font-size:13px; cursor:pointer; }

  .next-steps { border-top:1px solid var(--border); padding-top:18px; margin-top:18px; }
  .next-steps h3 { font-size:14px; margin:0 0 4px; }
  .next-steps .sub { font-size:12.5px; color:#667; margin-bottom:14px; }
  .path-anchor { font-size:12px; color:#556; background:#f4f7f6; border:1px solid var(--border); border-radius:8px; padding:8px 12px; margin-bottom:12px; }
  .path-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
  @media (max-width:560px) { .path-grid { grid-template-columns:1fr; } }
  .path-card { border:1px solid var(--border); border-radius:12px; padding:16px; display:flex; flex-direction:column; }
  .path-card.recommended { border-color:var(--primary); box-shadow:0 0 0 1px var(--primary); }
  .path-card .path-tag { font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--primary); font-weight:700; margin-bottom:6px; }
  .path-card h4 { font-size:14.5px; margin:0 0 6px; }
  .path-card p { font-size:12.5px; color:#556; margin:0 0 10px; line-height:1.5; flex:1; }
  .path-card .price { font-size:13px; font-weight:700; color:var(--primary-dark); margin-bottom:4px; }
  .path-card .guarantee { font-size:11px; color:#667; margin-bottom:10px; }
  .path-card button { background:var(--primary); color:white; border:none; border-radius:8px; padding:9px 12px; font-size:13px; cursor:pointer; }
  .path-card button:hover { background:var(--primary-dark); }
  .path-card.secondary button { background:white; color:var(--primary); border:1px solid var(--primary); }
  .path-card.secondary button:hover { background:#eaf3f0; }
  .path-confirm { margin-top:14px; padding:12px 14px; background:#eef3f1; border-radius:10px; font-size:13px; color:#234f42; }

  .finance-upload { border:1px dashed var(--border); border-radius:12px; padding:16px; margin-top:16px; background:#fbfaf7; }
  .finance-upload h4 { font-size:13.5px; margin:0 0 4px; }
  .finance-upload p { font-size:12.5px; color:#556; margin:0 0 10px; line-height:1.5; }
  .finance-upload .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .finance-upload input[type=file] { font-size:12.5px; }
  .finance-upload button { background:var(--primary); color:white; border:none; border-radius:8px; padding:8px 14px; font-size:12.5px; cursor:pointer; }
  .finance-upload button:disabled { background:#aab; cursor:not-allowed; }
  .finance-upload .disclaimer { font-size:11px; color:#889; margin-top:8px; line-height:1.4; }
  .finance-upload .confirm { margin-top:10px; padding:9px 12px; background:#eef3f1; border-radius:8px; font-size:12.5px; color:#234f42; }

  .ai-qa-panel { border:1px solid var(--border); border-radius:12px; padding:16px; margin-top:16px; background:white; }
  .ai-qa-panel h4 { font-size:13.5px; margin:0 0 4px; }
  .ai-qa-panel p.sub { font-size:12.5px; color:#556; margin:0 0 10px; line-height:1.5; }
  .ai-qa-panel .ai-msgs { max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .ai-qa-panel .ai-msg { font-size:12.5px; padding:8px 11px; border-radius:10px; max-width:85%; line-height:1.4; }
  .ai-qa-panel .ai-msg.user { align-self:flex-end; background:var(--user-bubble); color:white; }
  .ai-qa-panel .ai-msg.bot { align-self:flex-start; background:var(--bot-bubble); }
  .ai-qa-panel .ai-msg.ai-typing { color:#667; font-style:italic; }
  .ai-qa-panel .ai-msg.ai-error { background:#fdecea; color:#8a2f22; }
  .ai-retry-btn { margin-top:4px; padding:4px 10px; border-radius:7px; border:1px solid currentColor; background:transparent; color:inherit; font-size:12px; font-weight:600; cursor:pointer; }
  .ai-retry-btn:hover { background:rgba(0,0,0,0.05); }
  .ai-qa-panel .row { display:flex; gap:8px; }
  .ai-qa-panel input[type=text] { flex:1; padding:9px 12px; border-radius:8px; border:1px solid var(--border); font-size:13px; }
  .ai-qa-panel button { background:var(--primary); color:white; border:none; border-radius:8px; padding:0 16px; font-size:13px; cursor:pointer; }
  .ai-qa-panel button:disabled { background:#aab; cursor:not-allowed; }
  .ai-qa-panel .unavailable { font-size:12px; color:#889; font-style:italic; }
  .ai-qa-panel .price-note { font-size:11px; color:#889; margin-top:8px; }
  .ai-qa-panel .ai-disclosure { font-size:12px; color:#7a5b00; background:#fff8e6; border:1px solid #f0dfa0; border-radius:8px; padding:9px 11px; margin-bottom:10px; line-height:1.45; }

  /* Command Center-kaart (taak #262) — minimale vertical-slice status in de AI-Q&A-terugkeerflow
     (renderQaReturnScreen): welke diagnose nu actief is, streef-KPI + huidige waarde, de
     eerstvolgende playbook-stap, en een indicatieve volgende hermeetdatum. Toont enkel wat de
     backend (_command_center_summary in main.py) al kant-en-klaar berekend heeft. */
  .cc-card { border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin:16px 20px 0; background:linear-gradient(135deg,#f4f8f6,#ffffff); }
  .cc-card .cc-label { font-size:10.5px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--primary); margin-bottom:6px; }
  .cc-card h3 { font-size:15px; margin:0 0 10px; color:var(--primary-dark); }
  .cc-card .cc-row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; font-size:12.5px; padding:7px 0; border-top:1px solid #eef1ef; }
  .cc-card .cc-row:first-of-type { border-top:none; }
  .cc-card .cc-row .cc-k { color:#667; flex-shrink:0; }
  .cc-card .cc-row .cc-v { color:#234f42; font-weight:600; text-align:right; }
  .cc-card .cc-row .cc-v .cc-faint { font-weight:400; color:#889; }
  .cc-card .cc-step { font-size:12.5px; color:#334; background:#fbfaf7; border-radius:8px; padding:9px 11px; margin-top:8px; line-height:1.45; }
  .cc-card .cc-foot { font-size:11px; color:#889; margin-top:10px; line-height:1.4; }

  /* AI-Q&A pop-up — enkel voor de betaalde, post-scan terugkeer-flow (magic link, zie
     renderQaReturnScreen()). De gratis proefsessie tijdens de scan zelf blijft het bestaande
     ingebedde .ai-qa-panel hierboven; bewust niet aangeraakt. Eigen merkkleuren (var(--primary)/
     var(--primary-dark)), geen WhatsApp-groen — enkel de vertrouwde bubble-structuur is
     "messaging-app"-achtig, de kleur is en blijft Zenpertise-eigen. */
  .qa-fab {
    position:fixed; bottom:22px; right:22px; width:56px; height:56px; border-radius:50%;
    background:var(--primary); color:white; border:none; box-shadow:0 4px 18px rgba(35,79,66,0.35);
    font-size:23px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:1001;
  }
  .qa-fab:hover { background:var(--primary-dark); }
  .qa-popup-overlay {
    position:fixed; inset:0; background:rgba(15,30,25,0.28); display:none;
    align-items:flex-end; justify-content:flex-end; padding:24px; z-index:1000;
  }
  .qa-popup-overlay.open { display:flex; }
  .qa-popup {
    width:380px; max-width:100%; height:600px; max-height:calc(100vh - 48px); background:white;
    border-radius:18px; box-shadow:0 12px 40px rgba(0,0,0,0.22); display:flex; flex-direction:column;
    overflow:hidden;
  }
  @media (max-width:480px) {
    .qa-popup-overlay { padding:0; }
    .qa-popup { width:100%; height:100%; max-height:none; border-radius:0; }
  }
  .qa-popup-header { background:var(--primary-dark); color:white; padding:14px 16px; display:flex; align-items:center; gap:11px; flex-shrink:0; }
  .qa-popup-avatar { width:38px; height:38px; border-radius:50%; background:var(--primary); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14.5px; flex-shrink:0; }
  .qa-popup-header-text { flex:1; min-width:0; }
  .qa-popup-header-text .name { font-size:14.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qa-popup-header-text .status { font-size:11.5px; opacity:0.85; display:flex; align-items:center; gap:5px; margin-top:1px; }
  .qa-popup-header-text .status .dot { width:7px; height:7px; border-radius:50%; background:#6fcf97; display:inline-block; flex-shrink:0; }
  .qa-popup-close { background:rgba(255,255,255,0.15); border:none; color:white; width:28px; height:28px; border-radius:50%; font-size:14px; cursor:pointer; flex-shrink:0; line-height:1; }
  .qa-popup-close:hover { background:rgba(255,255,255,0.28); }
  .qa-popup-disclosure { font-size:11px; color:#7a5b00; background:#fff8e6; border-bottom:1px solid #f0dfa0; padding:8px 16px; line-height:1.4; flex-shrink:0; }
  .qa-popup-canvas { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; background:#e2ece6; }
  .qa-popup-msg { max-width:82%; padding:9px 13px; border-radius:14px; font-size:13.5px; line-height:1.45; white-space:pre-wrap; }
  .qa-popup-msg.bot { align-self:flex-start; background:white; border-bottom-left-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,0.08); }
  .qa-popup-msg.user { align-self:flex-end; background:var(--primary); color:white; border-bottom-right-radius:4px; }
  .qa-popup-msg.qa-popup-typing { color:#667; font-style:italic; box-shadow:none; }
  .qa-popup-msg.qa-popup-error { background:#fdecea; color:#8a2f22; box-shadow:none; }
  .qa-popup-input-row { display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--border); background:white; flex-shrink:0; }
  .qa-popup-input-row input { flex:1; padding:10px 13px; border-radius:10px; border:1px solid var(--border); font-size:13.5px; }
  .qa-popup-input-row button { background:var(--primary); color:white; border:none; border-radius:10px; padding:0 16px; font-size:13.5px; cursor:pointer; }
  .qa-popup-input-row button:hover { background:var(--primary-dark); }
  .qa-popup-input-row button:disabled { background:#aab; cursor:not-allowed; }

  .qa-addon-picker { border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:12px; background:#fbfaf7; }
  .qa-addon-picker .qa-addon-title { font-weight:700; font-size:13px; margin-bottom:8px; color:#234f42; }
  .qa-addon-picker label { display:flex; align-items:flex-start; gap:8px; font-size:12.5px; color:#334; line-height:1.4; margin-bottom:7px; cursor:pointer; }
  .qa-addon-picker label:last-of-type { margin-bottom:0; }
  .qa-addon-picker input[type=radio] { margin-top:2px; flex-shrink:0; }
  .qa-addon-picker .qa-addon-total { margin-top:10px; padding-top:10px; border-top:1px solid var(--border); font-size:13px; font-weight:700; color:#234f42; }

  .improve-wrapper { position:relative; }
  .improve-list.locked { filter:blur(5px); user-select:none; pointer-events:none; }
  .lock-overlay {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; background:linear-gradient(to bottom, rgba(244,247,246,0.35), rgba(244,247,246,0.92) 55%);
  }
  .lock-overlay .lock-icon { font-size:26px; margin-bottom:8px; }
  .lock-overlay p { font-size:13px; color:#234f42; max-width:300px; margin:0; font-weight:600; line-height:1.4; }
  .lock-overlay .lock-sub { font-weight:400; color:#556; font-size:12px; margin-top:4px; }

  .access-gate { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:24px; z-index:999; }
  .access-card { background:white; border-radius:14px; box-shadow:0 2px 14px rgba(0,0,0,0.06); border:1px solid var(--border); padding:32px 28px; max-width:360px; width:100%; text-align:center; }
  .access-card .access-icon { font-size:30px; margin-bottom:10px; }
  .access-card h2 { font-size:17px; margin:0 0 8px; color:var(--primary-dark); }
  .access-card p { font-size:13px; color:#556; line-height:1.5; margin:0 0 16px; }
  .access-card input { width:100%; padding:10px 13px; border-radius:10px; border:1px solid var(--border); font-size:14px; margin-bottom:10px; text-align:center; letter-spacing:0.05em; box-sizing:border-box; }
  .access-card button { width:100%; background:var(--primary); color:white; border:none; border-radius:10px; padding:10px 18px; font-size:14px; cursor:pointer; }
  .access-card button:hover { background:var(--primary-dark); }
  .access-error { color:var(--red) !important; font-weight:600; margin-top:10px !important; margin-bottom:0 !important; }
</style>
</head>

  const sectorPicker = document.getElementById("sectorPicker");
  const headerSub = document.getElementById("headerSub");
  const chatArea = document.getElementById("chatArea");
  const messagesEl = document.getElementById("messages");
  const quickRepliesEl = document.getElementById("quickReplies");

  const micBtn = document.getElementById("micBtn");

  // Tekst-naar-spraak — de bot leest zijn vragen/berichten hardop voor.
  // Uit te zetten via de knop rechtsboven in de header.
  const ttsSupported = "speechSynthesis" in window;
  let voiceEnabled = ttsSupported;
  let dutchVoice = null;
  if (ttsSupported) {
    function pickDutchVoice() {
      const voices = window.speechSynthesis.getVoices();
      dutchVoice = voices.find((v) => v.lang === "nl-BE") || voices.find((v) => v.lang && v.lang.startsWith("nl")) || null;
    }
    pickDutchVoice();
    window.speechSynthesis.onvoiceschanged = pickDutchVoice;
  } else {
    voiceToggle.style.display = "none";
  }

  function speak(text) {
    if (!ttsSupported || !voiceEnabled || !text) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "nl-BE";
    if (dutchVoice) utter.voice = dutchVoice;
    utter.rate = 1;
    window.speechSynthesis.speak(utter);
  }

  voiceToggle.addEventListener("click", () => {
    voiceEnabled = !voiceEnabled;
    voiceToggle.textContent = voiceEnabled ? "🔊" : "🔇";
    voiceToggle.classList.toggle("muted", !voiceEnabled);
    voiceToggle.title = voiceEnabled ? "Bot spreekt vragen uit — klik om te dempen" : "Spraakweergave gedempt — klik om aan te zetten";
    if (!voiceEnabled) window.speechSynthesis.cancel();
  });

  let currentSector = null;
  let flatQuestions = [];
  let qIndex = 0;
  let answers = {};
  let chosenPath = null;
  let whatsappNumber = null;
  let paymentConfigured = false; // wordt bijgewerkt zodra /api/config antwoordt (zie showReport)

  // Zet de ruwe antwoorden om naar {vraag, antwoord}-paren (leesbare vraagtekst i.p.v. interne
  // sleutel) — gedeeld door het AI-Q&A-paneel en de lead-aanvraag, zodat de backend altijd weet
  // wélke vraag bij welk antwoord hoort.
  function answeredQaList() {
    // perspLabel meesturen zodat de backend antwoorden correct per BSC-perspectief kan groeperen
    // in het rapport (bv. de uitgebreide PDF) zonder de vragenlijst zelf te moeten dupliceren.
    return flatQuestions.map((q) => ({ vraag: q.label, antwoord: answers[q.key] || "", perspectief: q.perspLabel }));
  }

  function renderSectorPicker() {
    sectorPicker.innerHTML = "";
    Object.keys(SECTORS).forEach((key) => {
      const s = SECTORS[key];
      const btn = document.createElement("button");
      btn.className = "sector-btn";
      btn.innerHTML = '<span class="icon">' + s.icon + '</span><span class="name">' + s.name + '</span><span class="desc">Quick scan starten</span>';
      btn.onclick = () => startScan(key);
      sectorPicker.appendChild(btn);
    });
  }

  function startScan(key) {
    currentSector = key;
    answers = {};
    qIndex = 0;
    // Eerst een losse basisvraag: hoeveel patiënten/cliënten kan de praktijk maximaal per week zien?
    // Dat getal is de 100%-basis waartegen we bezetting/no-show/niet-betaald hieronder automatisch
    // herrekenen — de praktijkeigenaar hoeft dus geen percentages zelf in te schatten, enkel de
    // ruwe aantallen die hij toch al kent. Telt niet mee als één van de "12 vragen" en beïnvloedt de
    // score niet rechtstreeks (geen status()-functie, dus nooit in BSC-perspectieven/rapport).
    flatQuestions = [
      {
        key: "maxCapaciteit", perspKey: "setup", perspLabel: "Basisgegevens", isSetup: true,
        label: "Om te beginnen: hoeveel patiënten/cliënten kan je praktijk maximaal per week zien? (getal, bv. 60 — dit is je 100%-basis, de volgende vragen rekenen we automatisch om naar percentages)",
        numeric: { min: 1 },
      },
    ];
    BSC.forEach((persp) => persp.questions.forEach((q) => flatQuestions.push({ perspKey: persp.key, perspLabel: persp.label, ...q })));

    sectorPicker.style.display = "none";
    reportArea.style.display = "none";
    chatArea.style.display = "block";
    messagesEl.innerHTML = "";
    headerSub.textContent = SECTORS[key].name + " — quick scan loopt";
    botSay("We starten de quick scan voor jouw " + SECTORS[key].name.toLowerCase() + "praktijk. Eerst één basisvraag over je praktijkcapaciteit, daarna 21 korte vragen verdeeld over 5 aandachtsgebieden — naast de operationele cijfers ook enkele strategische vragen over je businessmodel, en je eigen leiderschap en veerkracht als praktijkhouder. Percentages berekenen we automatisch voor je op basis van de aantallen die je invult.");
    setTimeout(askNext, 400);
  }

  function addMessage(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function botSay(text, delay) {
    return new Promise((resolve) => setTimeout(() => { addMessage(text, "bot"); speak(text); resolve(); }, delay || 300));
  }

  function setQuickReplies(options) {
    quickRepliesEl.innerHTML = "";
    (options || []).forEach((opt) => {
      const btn = document.createElement("button");
      btn.textContent = opt;
      btn.onclick = () => handleAnswer(opt);
      quickRepliesEl.appendChild(btn);
    });
  }

  function updateProgress() {
    const q = flatQuestions[qIndex];
    if (q && q.isSetup) { progressEl.textContent = "Basisvraag"; return; }
    const setupCount = flatQuestions.filter((fq) => fq.isSetup).length;
    const total = flatQuestions.length - setupCount;
    progressEl.textContent = "Vraag " + Math.min(qIndex - setupCount + 1, total) + " van " + total;
  }

  let lastPerspective = null;
  async function askNext() {
    if (qIndex >= flatQuestions.length) {
      showReport();
      return;
    }
    updateProgress();
    const q = flatQuestions[qIndex];
    if (q.perspKey !== lastPerspective) {
      lastPerspective = q.perspKey;
      const div = document.createElement("div");
      div.className = "msg perspective";
      div.textContent = q.perspLabel;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      await new Promise((r) => setTimeout(r, 250));
    }
    await botSay(q.label);
    setQuickReplies(q.quick);
  }

  // Masterplan §2 (P0): "Tekst en negatieve aantallen worden aanvaard" — vóór deze fix accepteerde
  // elk numeriek veld letterlijk om het even welke tekst; status()-functies vielen dan stilzwijgend
  // terug op "amber" (parseFloat(tekst) => NaN) of rekenden gewoon door met een negatief getal.
  // validateAnswer() is de ene, centrale invoerpoort: numerieke vragen (q.numeric) worden geparsed
  // en tegen min/max gecontroleerd; vragen met vaste keuzeopties (q.quick) moeten letterlijk (of als
  // ondubbelzinnig voorvoegsel van) één van die opties overeenkomen. Alleen bij een geldig antwoord
  // gaat de flow verder — anders blijft dezelfde vraag actief en toont de bot waarom het antwoord
  // niet werd aanvaard, zodat de gebruiker meteen kan corrigeren.
  function validateAnswer(q, text) {
    if (q.numeric) {
      const normalized = text.replace(",", ".").replace(/\s+/g, "");
      const n = parseFloat(normalized);
      if (!/^-?\d+(\.\d+)?$/.test(normalized) || isNaN(n)) {
        return { ok: false, error: "Dat is geen geldig getal. Voer enkel een getal in (bv. 8), geen tekst.", };
      }
      if (typeof q.numeric.min === "number" && n < q.numeric.min) {
        return { ok: false, error: "Voer een getal in van minstens " + q.numeric.min + " (negatieve aantallen zijn niet mogelijk)." };
      }
      if (typeof q.numeric.max === "number" && n > q.numeric.max) {
        return { ok: false, error: "Voer een getal in van maximaal " + q.numeric.max + "." };
      }
      return { ok: true, value: String(n) };
    }
    if (q.quick && q.quick.length) {
      const norm = text.trim().toLowerCase();
      const match = q.quick.find((opt) => opt.toLowerCase() === norm || opt.toLowerCase().startsWith(norm) || norm.startsWith(opt.toLowerCase()));
      if (!match) {
        return { ok: false, error: "Kies één van de volgende opties (typ 'm of klik op de knop): " + q.quick.join(" / ") };
      }
      return { ok: true, value: match };
    }
    return { ok: true, value: text };
  }

  async function handleAnswer(rawText) {
    const text = (rawText || "").trim();
    if (!text) return;
    addMessage(text, "user");
    inputEl.value = "";
    if (micHint) micHint.style.display = "none";

    const q = flatQuestions[qIndex];
    const result = validateAnswer(q, text);
    if (!result.ok) {
      await botSay(result.error, 150);
      setQuickReplies(q.quick);
      return;
    }
    setQuickReplies([]);
    answers[q.key] = result.value;
    qIndex++;
    await askNext();
  }

  // Masterplan §2 (P0-2, taak #282): "Eén centrale score-label-kleurfunctie" — vóór deze fix had de
  // ringgrafiek (zie ringTierColor hieronder) een EIGEN 4-tier-indeling (Sterk/Goed/Aandacht/
  // Kritiek, grenzen 80/70/50) naast deze 3-tier-indeling (Gezond/Aandachtspunt/Kritiek, grenzen
  // 80/50) die overal elders gebruikt werd — badges, snelle-winsten, en de backend-PDF (STATUS_LABEL/
  // _status_for in main.py). Daardoor kon dezelfde score twee verschillende labels krijgen (bv. "68 =
  // Kritiek" in het ene onderdeel, "70 = Aandacht" in het andere) — exact de "vertrouwensbreuk" uit
  // het masterplan. SCORE_STATUS is nu de ENE bron van waarheid voor kleur + label: scoreColor(),
  // badgeLabel(), de ringgrafiek en haar legende lezen allemaal hieruit. Grenzen/kleuren/labels komen
  // 1-op-1 overeen met STATUS_LABEL/_status_for in main.py — wijzig ze altijd samen.
  const SCORE_STATUS = {
    green: { label: "Gezond", fill: "#234f42" },
    amber: { label: "Aandachtspunt", fill: "#c98a2c" },
    red: { label: "Kritiek", fill: "#c0392b" },
  };
  // Masterplan §2 (P0-3, taak #283): leest q.improve op de juiste status uit — ondersteunt zowel de
  // (meest voorkomende) vlakke string als een {amber, rood}-object voor vragen zoals omzetTrend waar
  // het advies effectief per antwoordcode verschilt. Zelfde fallback-volgorde als main.py's
  // QUESTION_LIBRARY-lezer (_weak_subpoints): eerst de opgevraagde status, dan de andere, nooit leeg.
  function improveText(q, status) {
    if (q.improve && typeof q.improve === "object") {
      const key = status === "red" ? "rood" : "amber";
      return q.improve[key] || q.improve.amber || q.improve.rood || "";
    }
    return q.improve || "";
  }

  function badgeClass(status) {
    return status === "green" ? "green" : status === "amber" ? "amber" : "red";
  }
  function badgeLabel(status) {
    return (SCORE_STATUS[status] || SCORE_STATUS.red).label;
  }

  // Numerieke score per perspectief (0-100), zelfde model als in het Word-rapport,
  // zodat de grafiek en de statuslabels altijd overeenkomen.
  const SCORE_VALUE = { green: 100, amber: 55, red: 15 };
  const HEALTHY_TARGET = 80;
  function scoreColor(score) {
    if (score >= 80) return "green";
    if (score >= 50) return "amber";
    return "red";
  }
  function perspectiveScore(persp) {
    const vals = persp.questions.map((q) => SCORE_VALUE[q.status(answers[q.key], answers)]);
    return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
  }

  // Fase0 §7.6 (Development addendum): sectorspecifieke weergave-labels voor BSC-perspectieven,
  // spiegelbeeld van PERSPECTIVE_LABEL_OVERRIDES/_perspective_display_label in main.py. De
  // interne sleutel ("Klant" — persp.key/persp.label in BSC hierboven) blijft ONGEWIJZIGD overal
  // waar hij als data-sleutel dient: scoresObj[label] (payload naar backend), TOPIC_LABELS-lookup,
  // enz. Enkel de tekst die de gebruiker effectief te zien krijgt (grafieklabel, dashboard-kaarten,
  // score-cards) wisselt per sector via displayPerspLabel() hieronder. "Leren & Groei" blijft
  // expliciet ongewijzigd voor alle sectoren (bevestigd in het addendum).
  //
  // Het addendum noemde letterlijk enkel kine als voorbeeld, maar logopedist, tandarts en
  // huisarts spreken hun bezoekers in het Belgisch zorgjargon ook aan als "patiënt" — bewust
  // uitgebreid (na expliciete bevestiging) voor consistente, professionele terminologie.
  // Dierenarts blijft bewust op "Klant": de eigenaar (praktijkcontact) is niet het dier (patiënt).
  const PERSPECTIVE_LABEL_OVERRIDES = {
    kinesist: { "Klant": "Patiënt" },
    logopedist: { "Klant": "Patiënt" },
    tandarts: { "Klant": "Patiënt" },
    huisarts: { "Klant": "Patiënt" },
  };
  function perspectiveDisplayLabel(label, sectorName) {
    if (!sectorName || !label) return label;
    const overrides = PERSPECTIVE_LABEL_OVERRIDES[sectorName.trim().toLowerCase()] || {};
    return overrides[label] || label;
  }
  function displayPerspLabel(label) {
    const sectorName = (currentSector && SECTORS[currentSector]) ? SECTORS[currentSector].name : null;
    return perspectiveDisplayLabel(label, sectorName);
  }

  function svgLabel(text) {
    // Altijd het eerste woord: voorkomt dat lange labels buiten de grafiek vallen.
    const shortened = text.split(" ")[0];
    return shortened.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Was ooit een eigen 4-tier-schaal (Sterk/Goed/Aandacht/Kritiek) — nu enkel nog een dunne wrapper
  // rond de centrale SCORE_STATUS-tabel (zie taak #282-toelichting hierboven), zodat de ringgrafiek
  // en haar legende altijd exact hetzelfde label/kleur tonen als elke andere score-badge in de app.
  function ringTierColor(score) {
    const status = scoreColor(score);
    const meta = SCORE_STATUS[status];
    return { fill: meta.fill, name: meta.label };
  }

  function ringPolar(cx, cy, r, angleDeg) {
    const rad = angleDeg * Math.PI / 180; // 0deg = boven (12 uur), met de klok mee
    return [cx + r * Math.sin(rad), cy - r * Math.cos(rad)];
  }

  function ringWedgePath(cx, cy, rOuter, rInner, startDeg, endDeg) {
    const [x0o, y0o] = ringPolar(cx, cy, rOuter, startDeg);
    const [x1o, y1o] = ringPolar(cx, cy, rOuter, endDeg);
    const [x1i, y1i] = ringPolar(cx, cy, rInner, endDeg);
    const [x0i, y0i] = ringPolar(cx, cy, rInner, startDeg);
    const largeArc = (endDeg - startDeg) > 180 ? 1 : 0;
    return `M ${x0o.toFixed(2)} ${y0o.toFixed(2)} A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${x1o.toFixed(2)} ${y1o.toFixed(2)} L ${x1i.toFixed(2)} ${y1i.toFixed(2)} A ${rInner} ${rInner} 0 ${largeArc} 0 ${x0i.toFixed(2)} ${y0i.toFixed(2)} Z`;
  }

  // Professionele ringgrafiek (donut-segmenten) i.p.v. het oude "spiderweb" — voorkomt
  // afgekapte labels (zoals "Leiderschap") en overlappende "Doel"-tekst, en geeft elk
  // perspectief een eigen, duidelijk afgebakend segment met eigen statuskleur.
  function buildBscChartSvg(perspScores) {
    const W = 520, H = 440, cx = 260, cy = 214;
    const Router = 106, Rinner = 68;
    const badgeR = Router + 18, badgeSize = 30;
    const labelR = Router + 52;
    const N = perspScores.length;
    const segSpan = 360 / N;
    const gap = 4;
    const uid = "bsc" + Math.random().toString(36).slice(2, 8);

    const overall = Math.round(perspScores.reduce((a, p) => a + p.score, 0) / N);
    const priKeys = BSC.map((p) => p.key);

    const defs = `<defs>
      <radialGradient id="${uid}-bg" cx="50%" cy="50%" r="65%">
        <stop offset="0%" stop-color="#c98a2c" stop-opacity="0.10"/>
        <stop offset="55%" stop-color="#2f6f5e" stop-opacity="0.07"/>
        <stop offset="100%" stop-color="#2f6f5e" stop-opacity="0"/>
      </radialGradient>
      <filter id="${uid}-shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f2a22" flood-opacity="0.18"/>
      </filter>
      <filter id="${uid}-badge-shadow" x="-60%" y="-60%" width="220%" height="220%">
        <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#0f2a22" flood-opacity="0.22"/>
      </filter>
    </defs>`;

    let inner = "";
    inner += `<circle cx="${cx}" cy="${cy}" r="${Router * 1.42}" fill="url(#${uid}-bg)"/>`;
    // Fijne "instrument-dial" sierring net buiten de segmenten — decoratieve echo van het
    // "wave-mesh"-referentiebeeld, zonder de leesbaarheid van de score te hinderen.
    inner += `<circle cx="${cx}" cy="${cy}" r="${Router + 7}" fill="none" stroke="#c98a2c" stroke-opacity="0.35" stroke-width="1"/>`;
    for (let t = 0; t < 360; t += 15) {
      const [tx1, ty1] = ringPolar(cx, cy, Router + 3, t);
      const [tx2, ty2] = ringPolar(cx, cy, Router + 7, t);
      inner += `<line x1="${tx1.toFixed(2)}" y1="${ty1.toFixed(2)}" x2="${tx2.toFixed(2)}" y2="${ty2.toFixed(2)}" stroke="#c98a2c" stroke-opacity="0.28" stroke-width="1"/>`;
    }

    perspScores.forEach((p, i) => {
      const centerAngle = i * segSpan;
      const startAngle = centerAngle - segSpan / 2 + gap / 2;
      const endAngle = centerAngle + segSpan / 2 - gap / 2;
      const tier = ringTierColor(p.score);
      const path = ringWedgePath(cx, cy, Router, Rinner, startAngle, endAngle);
      inner += `<path d="${path}" fill="${tier.fill}" filter="url(#${uid}-shadow)"/>`;

      // Icoon-badge op de rand van elk segment (echoot de "radiating icon"-stijl uit het referentiebeeld).
      const [bx, by] = ringPolar(cx, cy, badgeR, centerAngle);
      inner += `<g filter="url(#${uid}-badge-shadow)">` +
        `<circle cx="${bx.toFixed(2)}" cy="${by.toFixed(2)}" r="${badgeSize / 2}" fill="white" stroke="${tier.fill}" stroke-width="2"/>` +
        `<g transform="translate(${(bx - 8).toFixed(2)}, ${(by - 8).toFixed(2)})">` +
          `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${tier.fill}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${DASH_ICON_PATHS[priKeys[i]] || DASH_ICON_PATHS.processen}</svg>` +
        `</g>` +
      `</g>`;

      const [lx, ly] = ringPolar(cx, cy, labelR, centerAngle);
      const sinC = Math.sin(centerAngle * Math.PI / 180);
      const anchor = Math.abs(sinC) < 0.35 ? "middle" : (sinC > 0 ? "start" : "end");
      const deficitText = p.score < HEALTHY_TARGET ? " (-" + (HEALTHY_TARGET - p.score) + ")" : "";
      inner += `<text x="${lx.toFixed(2)}" y="${ly.toFixed(2)}" font-family="-apple-system,Helvetica,Arial,sans-serif" text-anchor="${anchor}">` +
        `<tspan x="${lx.toFixed(2)}" dy="0" font-size="12.5" font-weight="700" fill="#234f42">${svgLabel(displayPerspLabel(p.label))}</tspan>` +
        `<tspan x="${lx.toFixed(2)}" dy="16" font-size="13" font-weight="700" fill="${tier.fill}">${p.score}${deficitText}</tspan>` +
        `</text>`;
    });

    // Centrale hub met het gemiddelde totaalscore — omringd door een subtiele "wave-mesh"-textuur
    // (dunne concentrische ringsegmenten in de merkkleuren) als decoratief centerstuk.
    inner += `<circle cx="${cx}" cy="${cy}" r="${Rinner - 2}" fill="none" stroke="#2f6f5e" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="1.5 3.5"/>`;
    inner += `<circle cx="${cx}" cy="${cy}" r="${Rinner - 10}" fill="none" stroke="#c98a2c" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="1 3"/>`;
    inner += `<circle cx="${cx}" cy="${cy}" r="${Rinner - 16}" fill="white" stroke="#e6dcc4" stroke-width="1.2"/>`;
    inner += `<text x="${cx}" y="${cy - 5}" text-anchor="middle" font-family="'Fraunces',Georgia,serif" font-size="32" font-weight="600" fill="#234f42">${overall}</text>`;
    inner += `<text x="${cx}" y="${cy + 15}" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.08em" fill="#8a7f6f">/100 SCORE</text>`;

    const legendItems = [
      [SCORE_STATUS.green.fill, SCORE_STATUS.green.label + " (≥80)"],
      [SCORE_STATUS.amber.fill, SCORE_STATUS.amber.label + " (50-79)"],
      [SCORE_STATUS.red.fill, SCORE_STATUS.red.label + " (<50)"],
    ];
    const legend = '<div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:6px;font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:11px;color:#556;">' +
      legendItems.map(([color, label]) => `<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${color};margin-right:4px;vertical-align:-1px;"></span>${label}</span>`).join("") +
      '</div>';

    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="auto" role="img" aria-label="BSC-scores per perspectief (ringgrafiek)">' + defs + inner + '</svg>' + legend;
  }

  // Kleine lijn-icoontjes (Feather-stijl) per BSC-perspectief, gebruikt in het dashboard hierboven.
  const DASH_ICON_PATHS = {
    financieel: '<polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/>',
    patient: '<path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    processen: '<circle cx="12" cy="12" r="3.2"/><path d="M19.2 14.7a1.6 1.6 0 0 0 .32 1.76l.05.06a1.9 1.9 0 1 1-2.7 2.7l-.05-.06a1.6 1.6 0 0 0-1.76-.32 1.6 1.6 0 0 0-.98 1.47V20.5a1.9 1.9 0 0 1-3.8 0v-.1a1.6 1.6 0 0 0-1.05-1.46 1.6 1.6 0 0 0-1.76.32l-.05.06a1.9 1.9 0 1 1-2.7-2.7l.06-.05a1.6 1.6 0 0 0 .32-1.76 1.6 1.6 0 0 0-1.47-.98H3.5a1.9 1.9 0 0 1 0-3.8h.1a1.6 1.6 0 0 0 1.46-1.05 1.6 1.6 0 0 0-.32-1.76l-.06-.05a1.9 1.9 0 1 1 2.7-2.7l.05.06a1.6 1.6 0 0 0 1.76.32H8.9a1.6 1.6 0 0 0 .98-1.47V3.5a1.9 1.9 0 0 1 3.8 0v.1a1.6 1.6 0 0 0 .98 1.47c.6.25 1.3.13 1.76-.32l.05-.06a1.9 1.9 0 1 1 2.7 2.7l-.06.05a1.6 1.6 0 0 0-.32 1.76v.1a1.6 1.6 0 0 0 1.47.98h.13a1.9 1.9 0 0 1 0 3.8h-.1a1.6 1.6 0 0 0-1.47.98z"/>',
    team: '<path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.66 2.69 3 6 3s6-1.34 6-3v-5"/>',
    leiderschap: '<circle cx="12" cy="8.2" r="5.2"/><path d="M8.3 12.9 7 22l5-3 5 3-1.3-9.1"/>',
  };
  function dashIconSvg(perspKey, size) {
    const s = size || 16;
    const paths = DASH_ICON_PATHS[perspKey] || DASH_ICON_PATHS.processen;
    return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';
  }
  const CHECK_ICON = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  const ARROW_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

  // Korte, neutrale onderwerp-titels per vraag (géén oplossingstekst — die blijft achter de paywall
  // in het "Verbeterpunten"-blok verderop, net zoals in de rest van deze teaserpagina).
  const TOPIC_LABELS = {
    patientenPerWeek: "Praktijkbezetting", nietBetaaldPerWeek: "Betalingsachterstand", omzetTrend: "Omzettrend",
    wachttijd: "Wachttijd verkorten", noShowPerWeek: "No-show reductie", laattijdigeAnnuleringen: "Laattijdige annuleringen", tevredenheid: "Tevredenheidsmeting",
    digitalisering: "Dossierdigitalisering", adminUren: "Administratietijd", gemisteOproepFlow: "Gemiste-oproep-opvang",
    bijscholing: "Teambijscholing", verloop: "Personeelsverloop", teamTevredenheid: "Teamtevredenheid",
    foutmanagement: "Foutmanagement", herstel: "Herstelmomenten", aanwezigheid: "Aanwezigheid onder druk",
  };

  // Bouwt het "ZENPERTISE OS"-stijl dashboard rond de ringgrafiek: hero-copy, Practice Health Score,
  // top-prioriteiten en snelle-win-titels. Alleen scores/titels — de concrete oplossingen blijven
  // gelockt in het "Verbeterpunten"-blok, zodat de bestaande teaser/paywall-opzet intact blijft.
  function buildBscDashboardHtml(perspScores, chartSvg, quickWins) {
    const N = perspScores.length;
    const overall = Math.round(perspScores.reduce((a, p) => a + p.score, 0) / N);
    const belowTarget = perspScores.filter((p) => p.score < HEALTHY_TARGET);
    const avgDeficit = belowTarget.length
      ? Math.round(belowTarget.reduce((a, p) => a + (HEALTHY_TARGET - p.score), 0) / belowTarget.length)
      : 0;

    const priKeys = BSC.map((p) => p.key);
    const sorted = perspScores.map((p, i) => ({ label: p.label, score: p.score, idx: i })).sort((a, b) => a.score - b.score);
    const topPriorities = sorted.slice(0, 2);

    let prioritiesHtml = "";
    topPriorities.forEach((p, rank) => {
      const key = priKeys[p.idx];
      const deficitTxt = p.score < HEALTHY_TARGET ? (HEALTHY_TARGET - p.score) + " punten onder doel" : "op doel";
      prioritiesHtml +=
        '<div class="priority-card">' +
          '<div class="rank-icon">' + dashIconSvg(key, 16) + '</div>' +
          '<div class="body">' +
            '<div class="num">0' + (rank + 1) + '</div>' +
            '<div class="name">' + escapeHtml(displayPerspLabel(p.label)) + '</div>' +
            '<div class="val" style="color:' + ringTierColor(p.score).fill + '">' + p.score + '/100</div>' +
            '<div class="deficit">' + deficitTxt + '</div>' +
          '</div>' +
          '<div class="arrow">' + ARROW_ICON + '</div>' +
        '</div>';
    });

    let quickWinsHtml = "";
    quickWins.slice(0, 3).forEach((qw) => {
      quickWinsHtml +=
        '<div class="quickwin-item"><div class="check">' + CHECK_ICON + '</div>' +
        '<div><span class="qtitle">' + escapeHtml(qw.title) + '</span>' +
        '<span class="qimpact">' + (qw.impact === "red" ? "Hoge impact" : "Gemiddelde impact") + '</span></div></div>';
    });
    if (!quickWinsHtml) {
      quickWinsHtml = '<div class="quickwin-item"><div class="check">' + CHECK_ICON + '</div>' +
        '<div><span class="qtitle">Geen kritieke snelle wins gevonden</span><span class="qimpact">Goed bezig</span></div></div>';
    }

    const dotPct = Math.max(2, Math.min(98, overall));

    return (
      '<div class="zos-dashboard">' +
        '<div class="zos-header">' +
          '<div class="zos-logo">' +
            '<img class="mark" src="' + ZOS_LOGO_MARK + '" alt="Zenpertise OS" style="width:30px;height:30px;border-radius:8px;flex-shrink:0;">' +
            '<div class="word"><b>ZENPERTISE</b><span>OS</span></div>' +
          '</div>' +
          '<div class="zos-eyebrow">Practice Balance Scorecard</div>' +
        '</div>' +
        '<div class="zos-col">' +
          '<div class="zos-headline">De gezondheid van je praktijk.<br>In <em>&eacute;&eacute;n oogopslag</em>.</div>' +
          '<div class="zos-sub">Vijf domeinen bepalen je praktijkresultaat. Zie waar je <strong>sterk staat</strong>, waar de kansen liggen en waar je nu het grootste verschil kan maken.</div>' +
          '<div class="health-card">' +
            '<div class="eyebrow">Practice Health Score</div>' +
            '<div class="row"><div class="score">' + overall + '<small>/100</small></div>' +
            (belowTarget.length ? '<div class="trend">' + belowTarget.length + ' van ' + N + ' onder doel</div>' : '<div class="trend">Alle domeinen op doel</div>') +
            '</div>' +
            '<div class="health-bar"><div class="dot" style="left:' + dotPct + '%"></div></div>' +
            '<div class="health-bar-labels"><span>0</span><span>50</span><span>100</span></div>' +
          '</div>' +
          '<div class="zos-quote">&ldquo;Focus op de juiste prioriteiten. Meet de vooruitgang. Groei duurzaam.&rdquo;</div>' +
        '</div>' +
        '<div class="zos-col zos-chart-col">' + chartSvg + '</div>' +
        '<div class="zos-col">' +
          '<div class="priorities-title">Top prioriteiten</div>' +
          prioritiesHtml +
          '<div class="quickwins-title">Snelle win-kansen</div>' +
          quickWinsHtml +
        '</div>' +
        '<div class="zos-footer">' +
          '<div class="zos-stat"><div class="ic">' + dashIconSvg("financieel", 15) + '</div><div><div class="val">' + belowTarget.length + ' van ' + N + '</div><div class="lbl">Domeinen onder doel</div></div></div>' +
          '<div class="zos-stat"><div class="ic">' + dashIconSvg("processen", 15) + '</div><div><div class="val">' + quickWins.length + '</div><div class="lbl">Concrete verbeterpunten</div></div></div>' +
          '<div class="zos-stat"><div class="ic">' + dashIconSvg("team", 15) + '</div><div><div class="val">+' + avgDeficit + ' pt</div><div class="lbl">Gem. afstand tot doel</div></div></div>' +
          '<div class="zos-stat"><div class="ic">' + dashIconSvg("leiderschap", 15) + '</div><div><div class="val">Evidence-based</div><div class="lbl">Benchmarking &amp; best practices</div></div></div>' +
        '</div>' +
      '</div>'
    );
  }

  function showReport() {
    chatArea.style.display = "none";
    reportArea.style.display = "block";

    const perspScores = BSC.map((persp) => ({ label: persp.label, score: perspectiveScore(persp) }));
    const chartSvg = buildBscChartSvg(perspScores);

    let scoreCardsHtml = "";
    let improveHtml = "";
    const quickWins = [];

    BSC.forEach((persp) => {
      const statuses = persp.questions.map((q) => q.status(answers[q.key], answers));
      // Perspectief-status = de slechtste van de drie
      const worst = statuses.includes("red") ? "red" : statuses.includes("amber") ? "amber" : "green";
      scoreCardsHtml +=
        '<div class="score-card"><div class="persp">' + escapeHtml(displayPerspLabel(persp.label)) + '</div>' +
        '<span class="badge ' + badgeClass(worst) + '">' + badgeLabel(worst) + '</span></div>';

      persp.questions.forEach((q) => {
        const st = q.status(answers[q.key], answers);
        if (st !== "green") {
          const calc = q.display ? q.display(answers[q.key], answers) : "";
          improveHtml +=
            '<div class="improve-item"><div class="dot ' + badgeClass(st) + '"></div>' +
            '<div><strong>' + escapeHtml(displayPerspLabel(persp.label)) + ':</strong> ' + escapeHtml(improveText(q, st)) +
            (calc ? '<span class="calc-note">' + escapeHtml(calc) + '</span>' : '') + '</div></div>';
          // Alleen het onderwerp (geen oplossingstekst) voor de "Snelle win-kansen"-tegel in het dashboard.
          quickWins.push({ title: TOPIC_LABELS[q.key] || displayPerspLabel(persp.label), impact: st });
        }
      });
    });
    quickWins.sort((a, b) => (a.impact === b.impact ? 0 : a.impact === "red" ? -1 : 1));

    const hasImprovements = !!improveHtml;
    if (!improveHtml) {
      improveHtml = '<div class="improve-item">Geen kritieke aandachtspunten gevonden op basis van deze antwoorden — goed bezig.</div>';
    }

    // Financieel perspectief zwak? Dan bieden we aan om een jaarrekening/boekhoud-Excel
    // aan te leveren voor een preciezere analyse (EBITDA, marges) — zie parse_financials.py.
    // Nooit fiscaal advies zelf geven, enkel cijfers inlezen en tonen; zie disclaimer.
    const financieelStatuses = BSC.find((p) => p.key === "financieel").questions.map((q) => q.status(answers[q.key], answers));
    const financieelZwak = financieelStatuses.includes("red") || financieelStatuses.includes("amber");
    const financeUploadHtml = financieelZwak
      ? '<div class="finance-upload">' +
          '<h4>Preciezere financiële analyse (optioneel)</h4>' +
          '<p>Je financiële score wijst op aandachtspunten. Wil je een preciezere EBITDA- en margeanalyse ' +
          '(in plaats van de ruwe inschatting hierboven)? Lever je jaarrekening (PDF) of een boekhoud-Excel aan — ' +
          'wij lezen de cijfers in en nemen de analyse mee in je volgende sessie.</p>' +
          '<div class="row">' +
            '<input type="file" id="financeFileInput" accept=".pdf,.xlsx,.xlsm">' +
            '<button id="financeUploadBtn" disabled>Aanleveren</button>' +
          '</div>' +
          '<div id="financeUploadConfirm"></div>' +

  // Vangt het bestand client-side op. Er is (nog) geen live backend om parse_financials.py
  // automatisch te draaien vanuit de browser — zodra die er is, vervangt een echte upload
  // (fetch naar een endpoint) dit bevestigingsbericht. Tot dan verwerkt een Zenpertise-
  // adviseur het bestand manueel voor de volgende sessie.
  function setupFinanceUpload() {
    const fileInput = document.getElementById("financeFileInput");
    const uploadBtn = document.getElementById("financeUploadBtn");
    const confirmEl = document.getElementById("financeUploadConfirm");
    if (!fileInput || !uploadBtn) return;

    fileInput.addEventListener("change", () => {
      uploadBtn.disabled = !fileInput.files.length;
    });

    uploadBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) return;
      uploadBtn.disabled = true;
      fileInput.disabled = true;

      if (!BACKEND_URL) {
        // Geen live backend geconfigureerd -> huidig (offline) gedrag: bevestigen dat het
        // bestand ontvangen is, verwerking gebeurt manueel voor de volgende sessie.
        confirmEl.innerHTML =
          '<div class="confirm">"' + escapeHtml(file.name) + '" ontvangen. We lezen de cijfers in en nemen ' +
          'de EBITDA-/margeanalyse mee in je volgende sessie.</div>';
        return;
      }

      confirmEl.innerHTML = '<div class="confirm">"' + escapeHtml(file.name) + '" wordt ingelezen...</div>';
      try {
        const formData = new FormData();
        formData.append("file", file);
        const res = await fetch(BACKEND_URL + "/api/parse-financials", { method: "POST", body: formData });
        if (!res.ok) throw new Error("Serverfout (" + res.status + ")");
        const data = await res.json();
        const n = data.aantal_herkend || 0;
        confirmEl.innerHTML =
          '<div class="confirm">"' + escapeHtml(file.name) + '" ingelezen — ' + n + ' post(en) herkend. ' +
          'We bespreken de EBITDA-/margeanalyse in je volgende sessie. ' + escapeHtml(data.disclaimer || '') + '</div>';
      } catch (err) {
        confirmEl.innerHTML =
          '<div class="confirm">"' + escapeHtml(file.name) + '" ontvangen, maar automatisch inlezen lukte nu niet ' +
          '(' + escapeHtml(err.message) + '). We verwerken het manueel voor je volgende sessie.</div>';
      }
    });
  }

  // Masterplan §4 (P0-4, taak #284): "AI-Q&A blijft hangen zonder status of herstel". Vóór deze fix
  // had fetch(BACKEND_URL + "/api/qa") geen timeout: bij een trage Render-cold-start (het gratis
  // tier slaapt na inactiviteit en heeft soms 30-50s nodig om op te starten) of een provider-storing
  // bleef de knop simpelweg uitgeschakeld zonder enige boodschap — de gebruiker had geen idee of er
  // nog iets gebeurde of dat het al mislukt was. callQaEndpoint() is nu de ENE gedeelde aanroep-kern
  // voor zowel het in-scan-paneel (setupAiQaPanel hieronder) als de terugkeer-popup
  // (sendQaPopupMessage): een AbortController dwingt een harde timeout af (met een boodschap die
  // expliciet een cold start noemt, i.p.v. een generieke foutmelding), en de aanroepers hieronder
  // tonen altijd een "typt..."-indicator tijdens het wachten plus een "Opnieuw proberen"-knop bij een
  // fout, die de laatst gestuurde vraag herstuurt zonder dat de gebruiker moet hertypen.
  const QA_TIMEOUT_MS = 45000;
  async function callQaEndpoint(payload) {
    if (typeof AbortController === "undefined") {
      // Zeer oude browser zonder AbortController: geen timeout mogelijk, maar minstens geen crash.
      try {
        const res = await fetch(BACKEND_URL + "/api/qa", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        if (!res.ok) return { ok: false, error: "Serverfout (" + res.status + ")." };
        return { ok: true, data: await res.json() };
      } catch (err) {
        return { ok: false, error: err.message || "Onbekende netwerkfout." };
      }
    }
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), QA_TIMEOUT_MS);
    try {
      const res = await fetch(BACKEND_URL + "/api/qa", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
        signal: controller.signal,
      });
      if (!res.ok) {
        let detail = "";
        try { const errBody = await res.json(); detail = errBody && errBody.detail ? errBody.detail : ""; } catch (e) { /* geen JSON-body, negeren */ }
        return { ok: false, error: "Serverfout (" + res.status + ")" + (detail ? ": " + detail : "") + "." };
      }
      return { ok: true, data: await res.json() };
    } catch (err) {
      if (err.name === "AbortError") {
        return { ok: false, error: "De AI-assistent reageert niet binnen " + Math.round(QA_TIMEOUT_MS / 1000) + " seconden — mogelijk een koude start van de server na inactiviteit." };
      }
      return { ok: false, error: err.message || "Onbekende netwerkfout." };
    } finally {
      clearTimeout(timer);
    }
  }

  // AI-Q&A-paneel: stuurt vragen naar POST /api/qa met sectorcontext + BSC-scores.
  // Zonder BACKEND_URL toont dit paneel een nette "binnenkort beschikbaar"-melding i.p.v. te
  // doen alsof het al werkt.
  let aiQaHistory = [];
  function setupAiQaPanel(perspScores) {
    const msgsEl = document.getElementById("aiQaMsgs");
    const inputEl2 = document.getElementById("aiQaInput");
    const sendBtn2 = document.getElementById("aiQaSendBtn");
    if (!msgsEl || !inputEl2 || !sendBtn2) return;

    aiQaHistory = [];

    if (!BACKEND_URL) {
      msgsEl.innerHTML = '<div class="unavailable">Deze functie komt binnenkort beschikbaar — het gesprek is nog niet gekoppeld aan een live server.</div>';
      inputEl2.disabled = true;
      sendBtn2.disabled = true;
      return;
    }

    const scoresObj = {};
    perspScores.forEach((p) => { scoresObj[p.label] = p.score; });

    function addAiMsg(text, cls) {
      const div = document.createElement("div");
      div.className = "ai-msg " + cls;
      div.textContent = text;
      msgsEl.appendChild(div);
      msgsEl.scrollTop = msgsEl.scrollHeight;
      return div;
    }
    function addAiTyping() {
      const div = document.createElement("div");
      div.className = "ai-msg bot ai-typing";
      div.textContent = "Bezig met typen…";
      msgsEl.appendChild(div);
      msgsEl.scrollTop = msgsEl.scrollHeight;
      return div;
    }
    function addAiRetry(message, onRetry) {
      const div = document.createElement("div");
      div.className = "ai-msg bot ai-error";
      div.appendChild(document.createTextNode(message + " "));
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "ai-retry-btn";
      btn.textContent = "Opnieuw proberen";
      btn.addEventListener("click", () => { div.remove(); onRetry(); });
      div.appendChild(btn);
      msgsEl.appendChild(div);
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }

    async function sendAiQa(retryText) {
      const isRetry = retryText !== undefined;
      const text = isRetry ? retryText : inputEl2.value.trim();
      if (!text) return;
      if (!isRetry) {
        addAiMsg(text, "user");
        aiQaHistory.push({ role: "user", content: text });
        inputEl2.value = "";
      }
      sendBtn2.disabled = true;
      const typingEl = addAiTyping();

      const result = await callQaEndpoint({
        sector: SECTORS[currentSector].name,
        scan_scores: scoresObj,
        scan_answers: answeredQaList(),
        history: aiQaHistory.slice(0, -1),
        message: text,
      });

      typingEl.remove();
      if (result.ok) {
        addAiMsg(result.data.reply, "bot");
        aiQaHistory.push({ role: "assistant", content: result.data.reply });
      } else {
        addAiRetry(result.error, () => sendAiQa(text));
      }
      sendBtn2.disabled = false;
    }

    sendBtn2.addEventListener("click", () => sendAiQa());
    inputEl2.addEventListener("keydown", (e) => { if (e.key === "Enter") sendAiQa(); });
  }
