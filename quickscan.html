<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenpertise Quick Scan — prototype</title>
<style>
  :root {
    --primary: #2f6f5e; --primary-dark: #234f42; --bg: #f4f7f6;
    --bot-bubble: #eef3f1; --user-bubble: #2f6f5e; --border: #dbe4e1;
    --green: #2e8b57; --amber: #c98a2c; --red: #c0392b;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:#1f2d29; display:flex; justify-content:center; padding:24px; }
  .app { width:100%; max-width:760px; }
  .card { background:white; border-radius:14px; box-shadow:0 2px 14px rgba(0,0,0,0.06); border:1px solid var(--border); overflow:hidden; display:flex; flex-direction:column; }
  .header { background:var(--primary); color:white; padding:16px 20px; position:relative; }
  .header h1 { font-size:17px; margin:0 0 2px; padding-right:34px; }
  .header p { font-size:12.5px; margin:0; opacity:0.9; padding-right:34px; }
  .voice-toggle { position:absolute; top:14px; right:14px; width:28px; height:28px; border-radius:50%; border:1px solid rgba(255,255,255,0.5); background:rgba(255,255,255,0.12); color:white; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .voice-toggle:hover { background:rgba(255,255,255,0.22); }
  .voice-toggle.muted { opacity:0.6; }
  .sector-picker { padding:20px; display:flex; flex-wrap:wrap; gap:10px; }
  .sector-btn { flex:1 1 45%; border:1px solid var(--border); background:white; border-radius:10px; padding:16px 12px; text-align:left; cursor:pointer; font-size:14px; }
  .sector-btn:hover { border-color:var(--primary); background:#eaf3f0; }
  .sector-btn .icon { font-size:22px; display:block; margin-bottom:6px; }
  .sector-btn .name { font-weight:700; display:block; }
  .sector-btn .desc { font-size:12px; color:#667; }
  .messages { flex:1; padding:16px; height:420px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 13px; border-radius:14px; font-size:14px; line-height:1.45; white-space:pre-wrap; }
  .msg.bot { align-self:flex-start; background:var(--bot-bubble); border-bottom-left-radius:4px; }
  .msg.user { align-self:flex-end; background:var(--user-bubble); color:white; border-bottom-right-radius:4px; }
  .msg.perspective { align-self:center; background:#e7edea; color:#234f42; font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:0.04em; padding:6px 14px; border-radius:999px; }
  .progress { padding:0 16px 8px; font-size:11.5px; color:#778; }
  .quick-replies { display:flex; flex-wrap:wrap; gap:8px; padding:0 16px 12px; }
  .quick-replies button { border:1px solid var(--primary); background:white; color:var(--primary); border-radius:999px; padding:7px 13px; font-size:13px; cursor:pointer; }
  .quick-replies button:hover { background:#eaf3f0; }
  .input-row { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border); }
  .input-row input { flex:1; padding:10px 13px; border-radius:10px; border:1px solid var(--border); font-size:14px; }
  .input-row button { background:var(--primary); color:white; border:none; border-radius:10px; padding:0 18px; font-size:14px; cursor:pointer; }
  .input-row button:hover { background:var(--primary-dark); }
  .input-row button.mic-btn { background:white; color:var(--primary); border:1px solid var(--border); padding:0 14px; font-size:16px; }
  .input-row button.mic-btn:hover { background:#eaf3f0; }
  .input-row button.mic-btn.listening { background:var(--red); color:white; border-color:var(--red); animation:mic-pulse 1.2s infinite; }
  @keyframes mic-pulse { 0%{ box-shadow:0 0 0 0 rgba(192,57,43,0.45); } 70%{ box-shadow:0 0 0 9px rgba(192,57,43,0); } 100%{ box-shadow:0 0 0 0 rgba(192,57,43,0); } }
  .mic-hint { padding:0 16px 4px; font-size:11px; color:#c0392b; }

  .report { padding:20px; }
  .report h2 { font-size:16px; margin:0 0 4px; color:var(--primary-dark); }
  .report .sub { font-size:12.5px; color:#667; margin-bottom:16px; }
  .bsc-chart { border:1px solid var(--border); border-radius:12px; padding:10px 8px 4px; margin-bottom:16px; background:white; }
  .score-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:20px; }
  .score-card { border:1px solid var(--border); border-radius:10px; padding:14px; }
  .score-card .persp { font-size:12px; color:#667; text-transform:uppercase; letter-spacing:0.03em; }
  .score-card .badge { display:inline-block; margin-top:6px; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; color:white; }
  .badge.green { background:var(--green); }
  .badge.amber { background:var(--amber); }
  .badge.red { background:var(--red); }
  .improve-list { border-top:1px solid var(--border); padding-top:14px; }
  .improve-list h3 { font-size:14px; margin:0 0 10px; }
  .improve-item { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .improve-item:last-child { border-bottom:none; }
  .improve-item .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; margin-top:4px; }
  .improve-item .dot.amber { background:var(--amber); }
  .improve-item .dot.red { background:var(--red); }
  .improve-item .calc-note { display:block; margin-top:3px; font-size:11.5px; color:#778; font-weight:400; }
  .restart-btn { margin:16px 0 0; background:white; border:1px solid var(--primary); color:var(--primary); border-radius:10px; padding:9px 14px; font-size:13px; cursor:pointer; }

  .next-steps { border-top:1px solid var(--border); padding-top:18px; margin-top:18px; }
  .next-steps h3 { font-size:14px; margin:0 0 4px; }
  .next-steps .sub { font-size:12.5px; color:#667; margin-bottom:14px; }
  .path-anchor { font-size:12px; color:#556; background:#f4f7f6; border:1px solid var(--border); border-radius:8px; padding:8px 12px; margin-bottom:12px; }
  .path-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:560px) { .path-grid { grid-template-columns:1fr; } }
  .path-card { border:1px solid var(--border); border-radius:12px; padding:16px; display:flex; flex-direction:column; }
  .path-card.recommended { border-color:var(--primary); box-shadow:0 0 0 1px var(--primary); }
  .path-card .path-tag { font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--primary); font-weight:700; margin-bottom:6px; }
  .path-card h4 { font-size:14.5px; margin:0 0 6px; }
  .path-card p { font-size:12.5px; color:#556; margin:0 0 10px; line-height:1.5; flex:1; }
  .path-card .price { font-size:13px; font-weight:700; color:var(--primary-dark); margin-bottom:4px; }
  .path-card .guarantee { font-size:11px; color:#667; margin-bottom:10px; }
  .path-card button { background:var(--primary); color:white; border:none; border-radius:8px; padding:9px 12px; font-size:13px; cursor:pointer; }
  .path-card button:hover { background:var(--primary-dark); }
  .path-card.secondary button { background:white; color:var(--primary); border:1px solid var(--primary); }
  .path-card.secondary button:hover { background:#eaf3f0; }
  .path-confirm { margin-top:14px; padding:12px 14px; background:#eef3f1; border-radius:10px; font-size:13px; color:#234f42; }

  .finance-upload { border:1px dashed var(--border); border-radius:12px; padding:16px; margin-top:16px; background:#fbfaf7; }
  .finance-upload h4 { font-size:13.5px; margin:0 0 4px; }
  .finance-upload p { font-size:12.5px; color:#556; margin:0 0 10px; line-height:1.5; }
  .finance-upload .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .finance-upload input[type=file] { font-size:12.5px; }
  .finance-upload button { background:var(--primary); color:white; border:none; border-radius:8px; padding:8px 14px; font-size:12.5px; cursor:pointer; }
  .finance-upload button:disabled { background:#aab; cursor:not-allowed; }
  .finance-upload .disclaimer { font-size:11px; color:#889; margin-top:8px; line-height:1.4; }
  .finance-upload .confirm { margin-top:10px; padding:9px 12px; background:#eef3f1; border-radius:8px; font-size:12.5px; color:#234f42; }

  .ai-qa-panel { border:1px solid var(--border); border-radius:12px; padding:16px; margin-top:16px; background:white; }
  .ai-qa-panel h4 { font-size:13.5px; margin:0 0 4px; }
  .ai-qa-panel p.sub { font-size:12.5px; color:#556; margin:0 0 10px; line-height:1.5; }
  .ai-qa-panel .ai-msgs { max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .ai-qa-panel .ai-msg { font-size:12.5px; padding:8px 11px; border-radius:10px; max-width:85%; line-height:1.4; }
  .ai-qa-panel .ai-msg.user { align-self:flex-end; background:var(--user-bubble); color:white; }
  .ai-qa-panel .ai-msg.bot { align-self:flex-start; background:var(--bot-bubble); }
  .ai-qa-panel .row { display:flex; gap:8px; }
  .ai-qa-panel input[type=text] { flex:1; padding:9px 12px; border-radius:8px; border:1px solid var(--border); font-size:13px; }
  .ai-qa-panel button { background:var(--primary); color:white; border:none; border-radius:8px; padding:0 16px; font-size:13px; cursor:pointer; }
  .ai-qa-panel button:disabled { background:#aab; cursor:not-allowed; }
  .ai-qa-panel .unavailable { font-size:12px; color:#889; font-style:italic; }
  .ai-qa-panel .price-note { font-size:11px; color:#889; margin-top:8px; }
  .ai-qa-panel .ai-disclosure { font-size:12px; color:#7a5b00; background:#fff8e6; border:1px solid #f0dfa0; border-radius:8px; padding:9px 11px; margin-bottom:10px; line-height:1.45; }

  /* AI-Q&A pop-up — enkel voor de betaalde, post-scan terugkeer-flow (magic link, zie
     renderQaReturnScreen()). De gratis proefsessie tijdens de scan zelf blijft het bestaande
     ingebedde .ai-qa-panel hierboven; bewust niet aangeraakt. Eigen merkkleuren (var(--primary)/
     var(--primary-dark)), geen WhatsApp-groen — enkel de vertrouwde bubble-structuur is
     "messaging-app"-achtig, de kleur is en blijft Zenpertise-eigen. */
  .qa-fab {
    position:fixed; bottom:22px; right:22px; width:56px; height:56px; border-radius:50%;
    background:var(--primary); color:white; border:none; box-shadow:0 4px 18px rgba(35,79,66,0.35);
    font-size:23px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:1001;
  }
  .qa-fab:hover { background:var(--primary-dark); }
  .qa-popup-overlay {
    position:fixed; inset:0; background:rgba(15,30,25,0.28); display:none;
    align-items:flex-end; justify-content:flex-end; padding:24px; z-index:1000;
  }
  .qa-popup-overlay.open { display:flex; }
  .qa-popup {
    width:380px; max-width:100%; height:600px; max-height:calc(100vh - 48px); background:white;
    border-radius:18px; box-shadow:0 12px 40px rgba(0,0,0,0.22); display:flex; flex-direction:column;
    overflow:hidden;
  }
  @media (max-width:480px) {
    .qa-popup-overlay { padding:0; }
    .qa-popup { width:100%; height:100%; max-height:none; border-radius:0; }
  }
  .qa-popup-header { background:var(--primary-dark); color:white; padding:14px 16px; display:flex; align-items:center; gap:11px; flex-shrink:0; }
  .qa-popup-avatar { width:38px; height:38px; border-radius:50%; background:var(--primary); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14.5px; flex-shrink:0; }
  .qa-popup-header-text { flex:1; min-width:0; }
  .qa-popup-header-text .name { font-size:14.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qa-popup-header-text .status { font-size:11.5px; opacity:0.85; display:flex; align-items:center; gap:5px; margin-top:1px; }
  .qa-popup-header-text .status .dot { width:7px; height:7px; border-radius:50%; background:#6fcf97; display:inline-block; flex-shrink:0; }
  .qa-popup-close { background:rgba(255,255,255,0.15); border:none; color:white; width:28px; height:28px; border-radius:50%; font-size:14px; cursor:pointer; flex-shrink:0; line-height:1; }
  .qa-popup-close:hover { background:rgba(255,255,255,0.28); }
  .qa-popup-disclosure { font-size:11px; color:#7a5b00; background:#fff8e6; border-bottom:1px solid #f0dfa0; padding:8px 16px; line-height:1.4; flex-shrink:0; }
  .qa-popup-canvas { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; background:#e2ece6; }
  .qa-popup-msg { max-width:82%; padding:9px 13px; border-radius:14px; font-size:13.5px; line-height:1.45; white-space:pre-wrap; }
  .qa-popup-msg.bot { align-self:flex-start; background:white; border-bottom-left-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,0.08); }
  .qa-popup-msg.user { align-self:flex-end; background:var(--primary); color:white; border-bottom-right-radius:4px; }
  .qa-popup-input-row { display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--border); background:white; flex-shrink:0; }
  .qa-popup-input-row input { flex:1; padding:10px 13px; border-radius:10px; border:1px solid var(--border); font-size:13.5px; }
  .qa-popup-input-row button { background:var(--primary); color:white; border:none; border-radius:10px; padding:0 16px; font-size:13.5px; cursor:pointer; }
  .qa-popup-input-row button:hover { background:var(--primary-dark); }
  .qa-popup-input-row button:disabled { background:#aab; cursor:not-allowed; }

  .qa-addon-picker { border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:12px; background:#fbfaf7; }
  .qa-addon-picker .qa-addon-title { font-weight:700; font-size:13px; margin-bottom:8px; color:#234f42; }
  .qa-addon-picker label { display:flex; align-items:flex-start; gap:8px; font-size:12.5px; color:#334; line-height:1.4; margin-bottom:7px; cursor:pointer; }
  .qa-addon-picker label:last-of-type { margin-bottom:0; }
  .qa-addon-picker input[type=radio] { margin-top:2px; flex-shrink:0; }
  .qa-addon-picker .qa-addon-total { margin-top:10px; padding-top:10px; border-top:1px solid var(--border); font-size:13px; font-weight:700; color:#234f42; }

  .improve-wrapper { position:relative; }
  .improve-list.locked { filter:blur(5px); user-select:none; pointer-events:none; }
  .lock-overlay {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; background:linear-gradient(to bottom, rgba(244,247,246,0.35), rgba(244,247,246,0.92) 55%);
  }
  .lock-overlay .lock-icon { font-size:26px; margin-bottom:8px; }
  .lock-overlay p { font-size:13px; color:#234f42; max-width:300px; margin:0; font-weight:600; line-height:1.4; }
  .lock-overlay .lock-sub { font-weight:400; color:#556; font-size:12px; margin-top:4px; }

  .access-gate { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:24px; z-index:999; }
  .access-card { background:white; border-radius:14px; box-shadow:0 2px 14px rgba(0,0,0,0.06); border:1px solid var(--border); padding:32px 28px; max-width:360px; width:100%; text-align:center; }
  .access-card .access-icon { font-size:30px; margin-bottom:10px; }
  .access-card h2 { font-size:17px; margin:0 0 8px; color:var(--primary-dark); }
  .access-card p { font-size:13px; color:#556; line-height:1.5; margin:0 0 16px; }
  .access-card input { width:100%; padding:10px 13px; border-radius:10px; border:1px solid var(--border); font-size:14px; margin-bottom:10px; text-align:center; letter-spacing:0.05em; box-sizing:border-box; }
  .access-card button { width:100%; background:var(--primary); color:white; border:none; border-radius:10px; padding:10px 18px; font-size:14px; cursor:pointer; }
  .access-card button:hover { background:var(--primary-dark); }
  .access-error { color:var(--red) !important; font-weight:600; margin-top:10px !important; margin-bottom:0 !important; }
</style>
</head>
<body>
<div id="accessGate" class="access-gate">
  <div class="access-card">
    <div class="access-icon">🔒</div>
    <h2>Zenpertise Quick Scan</h2>
    <p>Deze tool is nog niet publiek beschikbaar. Heb je een toegangscode van Zenpertise gekregen? Vul die hieronder in.</p>
    <input type="text" id="accessCodeInput" placeholder="Toegangscode" autocomplete="off">
    <button id="accessCodeBtn" type="button">Ontgrendelen</button>
    <p id="accessCodeError" class="access-error" style="display:none;">Onjuiste code — probeer opnieuw.</p>
  </div>
</div>
<div class="app" id="appRoot" style="display:none;">
  <div class="card">
    <div class="header">
      <button id="voiceToggle" class="voice-toggle" type="button" title="Bot spreekt vragen uit — klik om te dempen" aria-label="Spraakweergave aan/uit">🔊</button>
      <h1>Zenpertise Quick Scan</h1>
      <p id="headerSub">Kies je praktijktype om te starten — 15 vragen, 4 minuten.</p>
    </div>
    <div id="sectorPicker" class="sector-picker"></div>
    <div id="chatArea" style="display:none;">
      <div class="progress" id="progress"></div>
      <div class="messages" id="messages"></div>
      <div class="quick-replies" id="quickReplies"></div>
      <div class="mic-hint" id="micHint" style="display:none;"></div>
      <div class="input-row" id="inputRow">
        <input type="text" id="userInput" placeholder="Typ hier uw antwoord, of gebruik de microfoon..." autocomplete="off">
        <button id="micBtn" class="mic-btn" type="button" title="Spreek je antwoord in" aria-label="Spraakinvoer">🎤</button>
        <button id="sendBtn">Verstuur</button>
      </div>
    </div>
    <div id="reportArea" style="display:none;"></div>
  </div>
</div>

<script src="sectors_master.js"></script>

<script>
(function () {
  // Backend-URL voor de AI-Q&A-chat en de automatische boekhouding-inlezing (zie /backend).
  // Leeg = geen live backend geconfigureerd -> alle functies vallen netjes terug op hun
  // huidige (offline) gedrag. Zet dit op je live URL zodra je het backend gedeployed hebt,
  // bv. "https://zenpertise-backend.onrender.com" (zie backend/README.md).
  const BACKEND_URL = "https://zenpertise-backend.onrender.com";

  // AI-Q&A-add-on — spiegelt QA_ADDON_DAYS/QA_ADDON_PRICES in de backend (main.py). Enkel voor de
  // live prijsweergave hier in de checkout; de backend rekent en int het echte bedrag (zelfde
  // "frontend toont, backend int"-principe als bij PATH_PRICES in de backend).
  const PATH_BASE_PRICES = { digital: 25, consult: 650 };
  const QA_ADDON_PRICES_JS = { "": 0, "4weken": 15, "8weken": 25 };
  const QA_ADDON_LABELS_JS = { "4weken": "4 weken toegang tot de AI-adviseur", "8weken": "8 weken toegang, tot je herscan" };

  // Sectoren komen uit sectors_master.js (enige bron van waarheid, ook gebruikt
  // door intake_flow.html en generate_intake_docs.js). Hier is enkel name/icon nodig.
  const SECTORS = ZenpertiseSectors.SECTORS;

  // Balanced Scorecard — 4 perspectieven, 3 vragen elk.
  // status(value) geeft "green" | "amber" | "red" terug; improve-teksten worden
  // getoond bij amber/red.
  const BSC = [
    {
      key: "financieel", label: "Financieel",
      questions: [
        {
          key: "patientenPerWeek", label: "Hoeveel patiënten/cliënten zag je gemiddeld per week, de afgelopen maand? (getal)",
          status: (v, allAnswers) => {
            const seen = parseFloat(v);
            const cap = parseFloat(allAnswers && allAnswers.maxCapaciteit);
            if (isNaN(seen) || isNaN(cap) || cap <= 0) return "amber";
            const pct = (seen / cap) * 100;
            if (pct >= 85) return "green"; if (pct >= 70) return "amber"; return "red";
          },
          display: (v, allAnswers) => {
            const seen = parseFloat(v), cap = parseFloat(allAnswers && allAnswers.maxCapaciteit);
            return (!isNaN(seen) && !isNaN(cap) && cap > 0) ? "Gemeten bezetting: " + Math.round((seen / cap) * 100) + "% (" + seen + " van " + cap + ")." : "";
          },
          improve: "Verhoog de bezettingsgraad: analyseer piek- en daluren, en overweeg automatische herinneringen om no-shows te verlagen die slots vrijmaken.",
        },
        {
          key: "nietBetaaldPerWeek", label: "Bij hoeveel patiënten/cliënten per week blijft de betaling gemiddeld uit (niet meteen of niet na herinnering betaald)? (getal)",
          status: (v, allAnswers) => {
            const unpaid = parseFloat(v);
            const cap = parseFloat(allAnswers && allAnswers.maxCapaciteit);
            if (isNaN(unpaid) || isNaN(cap) || cap <= 0) return "amber";
            const pct = (unpaid / cap) * 100;
            if (pct <= 5) return "green"; if (pct <= 15) return "amber"; return "red";
          },
          display: (v, allAnswers) => {
            const unpaid = parseFloat(v), cap = parseFloat(allAnswers && allAnswers.maxCapaciteit);
            return (!isNaN(unpaid) && !isNaN(cap) && cap > 0) ? "Gemeten niet-betaald: " + Math.round((unpaid / cap) * 100) + "% (" + unpaid + " van " + cap + ")." : "";
          },
          improve: "Zet een vast opvolgproces op voor onbetaalde behandelingen (automatische herinnering na 14 en 30 dagen) om betalingsachterstand te verlagen.",
        },
        {
          key: "omzetTrend", label: "Is de omzet de afgelopen 6 maanden gestegen, gelijk gebleven of gedaald?",
          quick: ["Gestegen", "Gelijk gebleven", "Gedaald"],

  const sectorPicker = document.getElementById("sectorPicker");
  const headerSub = document.getElementById("headerSub");
  const chatArea = document.getElementById("chatArea");
  const messagesEl = document.getElementById("messages");
  const quickRepliesEl = document.getElementById("quickReplies");
  const inputEl = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");
  const micBtn = document.getElementById("micBtn");
  const micHint = document.getElementById("micHint");
  const voiceToggle = document.getElementById("voiceToggle");
  const progressEl = document.getElementById("progress");
  const reportArea = document.getElementById("reportArea");

  // Tekst-naar-spraak — de bot leest zijn vragen/berichten hardop voor.
  // Uit te zetten via de knop rechtsboven in de header.
  const ttsSupported = "speechSynthesis" in window;
  let voiceEnabled = ttsSupported;
  let dutchVoice = null;
  if (ttsSupported) {
    function pickDutchVoice() {
      const voices = window.speechSynthesis.getVoices();
      dutchVoice = voices.find((v) => v.lang === "nl-BE") || voices.find((v) => v.lang && v.lang.startsWith("nl")) || null;
    }
    pickDutchVoice();
    window.speechSynthesis.onvoiceschanged = pickDutchVoice;
  } else {
    voiceToggle.style.display = "none";
  }

  function speak(text) {
    if (!ttsSupported || !voiceEnabled || !text) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "nl-BE";
    if (dutchVoice) utter.voice = dutchVoice;
    utter.rate = 1;
    window.speechSynthesis.speak(utter);
  }

  voiceToggle.addEventListener("click", () => {
    voiceEnabled = !voiceEnabled;
    voiceToggle.textContent = voiceEnabled ? "🔊" : "🔇";
    voiceToggle.classList.toggle("muted", !voiceEnabled);
    voiceToggle.title = voiceEnabled ? "Bot spreekt vragen uit — klik om te dempen" : "Spraakweergave gedempt — klik om aan te zetten";
    if (!voiceEnabled) window.speechSynthesis.cancel();
  });

  let currentSector = null;
  let flatQuestions = [];
  let qIndex = 0;
  let answers = {};
  let chosenPath = null;
  let whatsappNumber = null;
  let paymentConfigured = false; // wordt bijgewerkt zodra /api/config antwoordt (zie showReport)

  // Zet de ruwe antwoorden om naar {vraag, antwoord}-paren (leesbare vraagtekst i.p.v. interne
  // sleutel) — gedeeld door het AI-Q&A-paneel en de lead-aanvraag, zodat de backend altijd weet
  // wélke vraag bij welk antwoord hoort.
  function answeredQaList() {
    // perspLabel meesturen zodat de backend antwoorden correct per BSC-perspectief kan groeperen
    // in het rapport (bv. de uitgebreide PDF) zonder de vragenlijst zelf te moeten dupliceren.
    return flatQuestions.map((q) => ({ vraag: q.label, antwoord: answers[q.key] || "", perspectief: q.perspLabel }));
  }

  function renderSectorPicker() {
    sectorPicker.innerHTML = "";
    Object.keys(SECTORS).forEach((key) => {
      const s = SECTORS[key];
      const btn = document.createElement("button");
      btn.className = "sector-btn";
      btn.innerHTML = '<span class="icon">' + s.icon + '</span><span class="name">' + s.name + '</span><span class="desc">Quick scan starten</span>';
      btn.onclick = () => startScan(key);
      sectorPicker.appendChild(btn);
    });
  }

  function startScan(key) {
    currentSector = key;
    answers = {};
    qIndex = 0;
    // Eerst een losse basisvraag: hoeveel patiënten/cliënten kan de praktijk maximaal per week zien?
    // Dat getal is de 100%-basis waartegen we bezetting/no-show/niet-betaald hieronder automatisch
    // herrekenen — de praktijkeigenaar hoeft dus geen percentages zelf in te schatten, enkel de
    // ruwe aantallen die hij toch al kent. Telt niet mee als één van de "12 vragen" en beïnvloedt de
    // score niet rechtstreeks (geen status()-functie, dus nooit in BSC-perspectieven/rapport).
    flatQuestions = [
      {
        key: "maxCapaciteit", perspKey: "setup", perspLabel: "Basisgegevens", isSetup: true,
        label: "Om te beginnen: hoeveel patiënten/cliënten kan je praktijk maximaal per week zien? (getal, bv. 60 — dit is je 100%-basis, de volgende vragen rekenen we automatisch om naar percentages)",
      },
    ];
    BSC.forEach((persp) => persp.questions.forEach((q) => flatQuestions.push({ perspKey: persp.key, perspLabel: persp.label, ...q })));

    sectorPicker.style.display = "none";
    reportArea.style.display = "none";
    chatArea.style.display = "block";
    messagesEl.innerHTML = "";
    headerSub.textContent = SECTORS[key].name + " — quick scan loopt";
    botSay("We starten de quick scan voor jouw " + SECTORS[key].name.toLowerCase() + "praktijk. Eerst één basisvraag over je praktijkcapaciteit, daarna 15 korte vragen verdeeld over 5 aandachtsgebieden — naast de operationele cijfers ook je eigen leiderschap en veerkracht als praktijkhouder. Percentages berekenen we automatisch voor je op basis van de aantallen die je invult.");
    setTimeout(askNext, 400);
  }

  function addMessage(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function botSay(text, delay) {
    return new Promise((resolve) => setTimeout(() => { addMessage(text, "bot"); speak(text); resolve(); }, delay || 300));
  }

  function setQuickReplies(options) {
    quickRepliesEl.innerHTML = "";
    (options || []).forEach((opt) => {
      const btn = document.createElement("button");
      btn.textContent = opt;
      btn.onclick = () => handleAnswer(opt);
      quickRepliesEl.appendChild(btn);
    });
  }

  function updateProgress() {
    const q = flatQuestions[qIndex];
    if (q && q.isSetup) { progressEl.textContent = "Basisvraag"; return; }
    const setupCount = flatQuestions.filter((fq) => fq.isSetup).length;
    const total = flatQuestions.length - setupCount;
    progressEl.textContent = "Vraag " + Math.min(qIndex - setupCount + 1, total) + " van " + total;
  }

  let lastPerspective = null;
  async function askNext() {
    if (qIndex >= flatQuestions.length) {
      showReport();
      return;
    }
    updateProgress();
    const q = flatQuestions[qIndex];
    if (q.perspKey !== lastPerspective) {
      lastPerspective = q.perspKey;
      const div = document.createElement("div");
      div.className = "msg perspective";
      div.textContent = q.perspLabel;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      await new Promise((r) => setTimeout(r, 250));
    }
    await botSay(q.label);
    setQuickReplies(q.quick);
  }

  async function handleAnswer(rawText) {
    const text = (rawText || "").trim();
    if (!text) return;
    addMessage(text, "user");
    setQuickReplies([]);
    inputEl.value = "";
    if (micHint) micHint.style.display = "none";

    const q = flatQuestions[qIndex];
    answers[q.key] = text;
    qIndex++;
    await askNext();
  }

  function badgeClass(status) {
    return status === "green" ? "green" : status === "amber" ? "amber" : "red";
  }
  function badgeLabel(status) {
    return status === "green" ? "Gezond" : status === "amber" ? "Aandachtspunt" : "Kritiek";
  }

  // Numerieke score per perspectief (0-100), zelfde model als in het Word-rapport,
  // zodat de grafiek en de statuslabels altijd overeenkomen.
  const SCORE_VALUE = { green: 100, amber: 55, red: 15 };
  const HEALTHY_TARGET = 80;
  function scoreColor(score) {
    if (score >= 80) return "green";
    if (score >= 50) return "amber";
    return "red";
  }
  function perspectiveScore(persp) {
    const vals = persp.questions.map((q) => SCORE_VALUE[q.status(answers[q.key], answers)]);
    return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
  }

  function svgLabel(text) {
    // Altijd het eerste woord: voorkomt dat lange labels buiten de grafiek vallen,
    // vooral bij de links/rechts geplaatste assen van het spiderweb.
    const shortened = text.split(" ")[0];
    return shortened.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function buildBscRadarSvg(perspScores) {
    const size = 380, cx = size / 2, cy = size / 2 + 4, R = 108;
    const N = perspScores.length;
    const hexDark = { green: "#1f6b46", amber: "#a8650f", red: "#8f2415" };
    const hexLight = { green: "#6ee7b0", amber: "#ffd98a", red: "#ff9c8a" };
    const uid = "bsc" + Math.random().toString(36).slice(2, 8);

    function angleFor(i) { return -Math.PI / 2 + i * (2 * Math.PI / N); }
    function pointFor(i, value) {
      const r = (value / 100) * R;
      const a = angleFor(i);
      return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    }

    const defs = `<defs>
      <radialGradient id="${uid}-bg" cx="50%" cy="45%" r="65%">
        <stop offset="0%" stop-color="#2f6f5e" stop-opacity="0.10"/>
        <stop offset="70%" stop-color="#2f6f5e" stop-opacity="0.03"/>
        <stop offset="100%" stop-color="#2f6f5e" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="${uid}-fill" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3d8f77" stop-opacity="0.78"/>
        <stop offset="100%" stop-color="#255a4a" stop-opacity="0.58"/>
      </linearGradient>
      <filter id="${uid}-shadow" x="-40%" y="-40%" width="180%" height="180%">
        <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f2a22" flood-opacity="0.30"/>
      </filter>
      <filter id="${uid}-softshadow" x="-80%" y="-80%" width="260%" height="260%">
        <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#0f2a22" flood-opacity="0.35"/>
      </filter>
      <filter id="${uid}-glow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="4.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      ${["green", "amber", "red"].map((c) => `<radialGradient id="${uid}-dot-${c}" cx="32%" cy="28%" r="75%">
        <stop offset="0%" stop-color="${hexLight[c]}"/>
        <stop offset="100%" stop-color="${hexDark[c]}"/>
      </radialGradient>`).join("")}
    </defs>`;

    let inner = "";

    // Zachte "vloer"-schaduw onder de grafiek voor dieptegevoel
    inner += `<ellipse cx="${cx}" cy="${cy + R * 0.94}" rx="${R * 0.95}" ry="${R * 0.15}" fill="#0f2a22" opacity="0.08"/>`;

    // Achtergrondgloed
    inner += `<circle cx="${cx}" cy="${cy}" r="${R * 1.22}" fill="url(#${uid}-bg)"/>`;

    // Gelaagde "terrein"-banden tussen de rasterringen (25/50/75/100)
    [25, 50, 75, 100].forEach((lvl, idx) => {
      const pts = perspScores.map((_, i) => pointFor(i, lvl).join(",")).join(" ");
      const bandOpacity = (0.05 + idx * 0.025).toFixed(3);
      inner += `<polygon points="${pts}" fill="#2f6f5e" fill-opacity="${bandOpacity}" stroke="#cfe0da" stroke-width="1"/>`;
    });

    // Assen
    perspScores.forEach((_, i) => {
      const [x, y] = pointFor(i, 100);
      inner += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#c9d8d2" stroke-width="1"/>`;
    });

    // Doelring op 80 (gestippeld)
    const targetPts = perspScores.map((_, i) => pointFor(i, HEALTHY_TARGET).join(",")).join(" ");
    inner += `<polygon points="${targetPts}" fill="none" stroke="#2f6f5e" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.55"/>`;

    // Schaduw van het scorepolygoon (geeft het gevoel dat het "zweeft" boven het raster)
    const scorePts = perspScores.map((p, i) => pointFor(i, p.score).join(",")).join(" ");
    inner += `<polygon points="${scorePts}" fill="#0f2a22" opacity="0.18" filter="url(#${uid}-shadow)" transform="translate(0,3)"/>`;

    // Scorepolygoon (het "spiderweb"): glasachtige gradient-fill + gloed
    inner += `<polygon points="${scorePts}" fill="url(#${uid}-fill)" stroke="#2f6f5e" stroke-width="2.5" filter="url(#${uid}-glow)"/>`;

    perspScores.forEach((p, i) => {
      const [x, y] = pointFor(i, p.score);
      const statusKey = scoreColor(p.score);

      // Glanzende 3D-bol per meetpunt
      inner += `<circle cx="${x}" cy="${y}" r="5.5" fill="url(#${uid}-dot-${statusKey})" stroke="white" stroke-width="1.5" filter="url(#${uid}-softshadow)"/>`;

      const a = angleFor(i);
      const cosA = Math.cos(a);
      const anchor = Math.abs(cosA) < 0.3 ? "middle" : (cosA > 0 ? "start" : "end");
      const [lx, ly] = pointFor(i, 122);
      inner += `<text x="${lx}" y="${ly}" font-size="11.5" font-weight="700" text-anchor="${anchor}" fill="#243b34">${svgLabel(p.label)}</text>`;

      const deficitText = p.score < HEALTHY_TARGET ? " (-" + (HEALTHY_TARGET - p.score) + ")" : "";
      const [sx, sy] = pointFor(i, Math.min(p.score + 13, 108));
      inner += `<text x="${sx}" y="${sy}" font-size="11" font-weight="700" text-anchor="middle" fill="${hexDark[statusKey]}">${p.score}${deficitText}</text>`;
    });

    const [tgx, tgy] = pointFor(0, HEALTHY_TARGET);
    inner += `<text x="${tgx + 8}" y="${tgy - 6}" font-size="10" font-weight="700" fill="#2f6f5e">Doel: gezond (${HEALTHY_TARGET})</text>`;

    // Centrale hub voor extra diepte
    inner += `<circle cx="${cx}" cy="${cy}" r="3" fill="#2f6f5e" opacity="0.5"/>`;

    return '<svg viewBox="0 0 ' + size + " " + (size + 8) + '" width="100%" height="auto" role="img" aria-label="BSC-scores per perspectief (spiderweb, 3D-stijl)">' + defs + inner + "</svg>";
  }

  function showReport() {
    chatArea.style.display = "none";
    reportArea.style.display = "block";

    const perspScores = BSC.map((persp) => ({ label: persp.label, score: perspectiveScore(persp) }));
    const chartSvg = buildBscRadarSvg(perspScores);

    let scoreCardsHtml = "";
    let improveHtml = "";

    BSC.forEach((persp) => {
      const statuses = persp.questions.map((q) => q.status(answers[q.key], answers));
      // Perspectief-status = de slechtste van de drie
      const worst = statuses.includes("red") ? "red" : statuses.includes("amber") ? "amber" : "green";
      scoreCardsHtml +=
        '<div class="score-card"><div class="persp">' + escapeHtml(persp.label) + '</div>' +
        '<span class="badge ' + badgeClass(worst) + '">' + badgeLabel(worst) + '</span></div>';

      persp.questions.forEach((q) => {
        const st = q.status(answers[q.key], answers);
        if (st !== "green") {
          const calc = q.display ? q.display(answers[q.key], answers) : "";
          improveHtml +=
            '<div class="improve-item"><div class="dot ' + badgeClass(st) + '"></div>' +
            '<div><strong>' + escapeHtml(persp.label) + ':</strong> ' + escapeHtml(q.improve) +
            (calc ? '<span class="calc-note">' + escapeHtml(calc) + '</span>' : '') + '</div></div>';
        }
      });
    });

    const hasImprovements = !!improveHtml;
    if (!improveHtml) {
      improveHtml = '<div class="improve-item">Geen kritieke aandachtspunten gevonden op basis van deze antwoorden — goed bezig.</div>';

    // Financieel perspectief zwak? Dan bieden we aan om een jaarrekening/boekhoud-Excel
    // aan te leveren voor een preciezere analyse (EBITDA, marges) — zie parse_financials.py.
    // Nooit fiscaal advies zelf geven, enkel cijfers inlezen en tonen; zie disclaimer.
    const financieelStatuses = BSC.find((p) => p.key === "financieel").questions.map((q) => q.status(answers[q.key], answers));
    const financieelZwak = financieelStatuses.includes("red") || financieelStatuses.includes("amber");
    const financeUploadHtml = financieelZwak
      ? '<div class="finance-upload">' +
          '<h4>Preciezere financiële analyse (optioneel)</h4>' +
          '<p>Je financiële score wijst op aandachtspunten. Wil je een preciezere EBITDA- en margeanalyse ' +

          'optimalisatie verwijzen we door naar de boekhouder van je praktijk. ' +
          '<strong>Lever enkel de jaarrekening of boekhoud-Excel van de praktijk zelf aan — nooit patiëntendossiers, ' +
          'medische gegevens of andere persoonsgegevens van patiënten/cliënten.</strong> Het bestand wordt automatisch ' +
          'ingelezen door een AI-systeem en niet permanent bewaard na verwerking.</div>' +

    // AI-Q&A-panel — tijdens de scan-sessie zelf altijd gratis te proberen (geen add-on nodig).

    const aiQaHtml =

        '</div>' +

    reportArea.innerHTML =

        '<h2>Quick Scan-rapport — ' + escapeHtml(SECTORS[currentSector].name) + 'praktijk</h2>' +
        '<div class="sub">Score per Balanced Scorecard-perspectief. De concrete verbeterpunten en oplossingen zitten in het volledige rapport.</div>' +
        '<div class="bsc-chart">' + chartSvg + '</div>' +
        '<div class="score-grid">' + scoreCardsHtml + '</div>' +
        '<div class="improve-wrapper">' +
          '<div class="improve-list' + (hasImprovements ? ' locked' : '') + '" id="improveList"><h3>Verbeterpunten</h3>' + improveHtml + '</div>' +
          (hasImprovements
            ? '<div class="lock-overlay" id="lockOverlay"><div class="lock-icon">🔒</div><p>De concrete verbeterpunten en gekoppelde oplossingen zitten in het volledige rapport.<span class="lock-sub"> Kies hieronder hoe je verder wil om ze te ontgrendelen.</span></p></div>'
            : '') +
        '</div>' +
        '<div class="next-steps">' +
          '<h3>Hoe wil je hiermee verder?</h3>' +
          '<div class="sub">Kies wat het best past — je kan later altijd wisselen.</div>' +
          '<div class="path-anchor">Ter vergelijking: persoonlijke praktijkbegeleiding bij externe consultants kost doorgaans €755 – €2.950 voor een gelijkaardig traject.</div>' +
          '<div class="path-grid">' +
            '<div class="path-card recommended">' +
              '<div class="path-tag">Persoonlijke begeleiding</div>' +
              '<h4>Begeleidingstraject</h4>' +
              '<p>3 sessies van 1,5u met een Zenpertise-adviseur, op maat van jouw scanresultaat. Directe opvolging en bijsturing op wat blijkt vast te lopen.</p>' +
              '<div class="price">€650 (3 sessies)</div>' +
              '<div class="guarantee">Niet tevreden na sessie 1? Volledige terugbetaling.</div>' +
              '<button data-path="consult">Consult aanvragen</button>' +
            '</div>' +
            '<div class="path-card secondary">' +
              '<div class="path-tag">Volledig digitaal</div>' +
              '<h4>Zelfstandig, met herscan</h4>' +
              '<p>Je gaat zelf aan de slag met de verbeterpunten. Na 8 weken sturen we automatisch een nieuwe scan zodat je vooruitgang zichtbaar wordt.</p>' +
              '<div class="price">€25 (herscan inbegrepen)</div>' +
              '<button data-path="digital">Kies digitaal + herscan</button>' +

          financeUploadHtml +

    reportArea.querySelectorAll(".path-card button").forEach((btn) => {
      btn.addEventListener("click", () => choosePath(btn.getAttribute("data-path")));

    if (financieelZwak) setupFinanceUpload();
    setupAiQaPanel(perspScores);

    // WhatsApp-nummer (voor de "meld dit via WhatsApp"-link na het invullen van de aanvraag) is
    // geen geheim — vraag het bij het openen van het rapport alvast op, zodat het klaar staat

    whatsappNumber = null;

        whatsappNumber = d.whatsapp_number || null;
        // Laat submitLead() meteen weten of online betalen (Mollie) beschikbaar is, zodat we geen
        // nutteloze mislukte betaalpoging doen als de server dat nog niet heeft ingesteld.
        paymentConfigured = !!d.payment_configured;

  // Vangt het bestand client-side op. Er is (nog) geen live backend om parse_financials.py
  // automatisch te draaien vanuit de browser — zodra die er is, vervangt een echte upload
  // (fetch naar een endpoint) dit bevestigingsbericht. Tot dan verwerkt een Zenpertise-
  // adviseur het bestand manueel voor de volgende sessie.
  function setupFinanceUpload() {
    const fileInput = document.getElementById("financeFileInput");
    const uploadBtn = document.getElementById("financeUploadBtn");
    const confirmEl = document.getElementById("financeUploadConfirm");
    if (!fileInput || !uploadBtn) return;

    fileInput.addEventListener("change", () => {
      uploadBtn.disabled = !fileInput.files.length;
    });

    uploadBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) return;
      uploadBtn.disabled = true;
      fileInput.disabled = true;

      if (!BACKEND_URL) {
        // Geen live backend geconfigureerd -> huidig (offline) gedrag: bevestigen dat het
        // bestand ontvangen is, verwerking gebeurt manueel voor de volgende sessie.
        confirmEl.innerHTML =
          '<div class="confirm">"' + escapeHtml(file.name) + '" ontvangen. We lezen de cijfers in en nemen ' +
          'de EBITDA-/margeanalyse mee in je volgende sessie.</div>';
        return;
      }

      confirmEl.innerHTML = '<div class="confirm">"' + escapeHtml(file.name) + '" wordt ingelezen...</div>';
      try {
        const formData = new FormData();
        formData.append("file", file);
        const res = await fetch(BACKEND_URL + "/api/parse-financials", { method: "POST", body: formData });
        if (!res.ok) throw new Error("Serverfout (" + res.status + ")");
        const data = await res.json();
        const n = data.aantal_herkend || 0;
        confirmEl.innerHTML =
          '<div class="confirm">"' + escapeHtml(file.name) + '" ingelezen — ' + n + ' post(en) herkend. ' +
          'We bespreken de EBITDA-/margeanalyse in je volgende sessie. ' + escapeHtml(data.disclaimer || '') + '</div>';
      } catch (err) {
        confirmEl.innerHTML =
          '<div class="confirm">"' + escapeHtml(file.name) + '" ontvangen, maar automatisch inlezen lukte nu niet ' +
          '(' + escapeHtml(err.message) + '). We verwerken het manueel voor je volgende sessie.</div>';
      }
    });
  }

  // AI-Q&A-paneel: stuurt vragen naar POST /api/qa met sectorcontext + BSC-scores.
  // Zonder BACKEND_URL toont dit paneel een nette "binnenkort beschikbaar"-melding i.p.v. te
  // doen alsof het al werkt.
  let aiQaHistory = [];
  function setupAiQaPanel(perspScores) {
    const msgsEl = document.getElementById("aiQaMsgs");
    const inputEl2 = document.getElementById("aiQaInput");
    const sendBtn2 = document.getElementById("aiQaSendBtn");
    if (!msgsEl || !inputEl2 || !sendBtn2) return;

    aiQaHistory = [];

    if (!BACKEND_URL) {
      msgsEl.innerHTML = '<div class="unavailable">Deze functie komt binnenkort beschikbaar — het gesprek is nog niet gekoppeld aan een live server.</div>';
      inputEl2.disabled = true;
      sendBtn2.disabled = true;
      return;
    }

    const scoresObj = {};
    perspScores.forEach((p) => { scoresObj[p.label] = p.score; });

    function addAiMsg(text, cls) {
      const div = document.createElement("div");
      div.className = "ai-msg " + cls;
      div.textContent = text;
      msgsEl.appendChild(div);
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }

    async function sendAiQa() {
      const text = inputEl2.value.trim();
      if (!text) return;
      addAiMsg(text, "user");
      aiQaHistory.push({ role: "user", content: text });
      inputEl2.value = "";
      sendBtn2.disabled = true;

      try {
        const res = await fetch(BACKEND_URL + "/api/qa", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sector: SECTORS[currentSector].name,
            scan_scores: scoresObj,
            scan_answers: answeredQaList(),
            history: aiQaHistory.slice(0, -1),
            message: text,
          }),
        });
        if (!res.ok) throw new Error("Serverfout (" + res.status + ")");
        const data = await res.json();
        addAiMsg(data.reply, "bot");
        aiQaHistory.push({ role: "assistant", content: data.reply });
      } catch (err) {
        addAiMsg("Er ging iets mis bij het ophalen van een antwoord (" + err.message + "). Probeer het later opnieuw.", "bot");
      } finally {
        sendBtn2.disabled = false;
      }
    }

    sendBtn2.addEventListener("click", sendAiQa);
    inputEl2.addEventListener("keydown", (e) => { if (e.key === "Enter") sendAiQa(); });
  }

  function choosePath(path) {
    const confirmEl = document.getElementById("pathConfirm");
    if (!confirmEl) return;

    // Beide paden ontgrendelen het volledige rapport — kiezen is de "betaalmuur"-actie.
    const improveListEl = document.getElementById("improveList");
    const lockOverlayEl = document.getElementById("lockOverlay");
    if (improveListEl) improveListEl.classList.remove("locked");
    if (lockOverlayEl) lockOverlayEl.remove();

    chosenPath = path;

    // Contactgegevens vragen we pas nu (niet vooraf tijdens de scan) — enkel wie effectief een
    // pad kiest, laat gegevens achter. Dit stuurt naar /api/submit-lead: dat genereert een PDF
    // van het rapport en mailt die naar de aanvrager én naar info@danyuzen.com, en levert het
    // WhatsApp-nummer voor de meldlink hieronder.

    confirmEl.innerHTML =
      '<div class="path-confirm">' +

          '<input type="tel" id="leadTelefoon" placeholder="GSM-nummer (optioneel, voor telefonisch contact)" style="padding:9px 12px;border-radius:8px;border:1px solid var(--border);font-size:13px;">' +
        '</div>' +
        '<div class="qa-addon-picker">' +
          '<div class="qa-addon-title">AI-Q&A-toegang na vandaag (optioneel)</div>' +
          '<label><input type="radio" name="qaAddon" value="" checked> Geen — enkel het rapport</label>' +
          '<label><input type="radio" name="qaAddon" value="4weken"> ' + escapeHtml(QA_ADDON_LABELS_JS["4weken"]) + ' (+€' + QA_ADDON_PRICES_JS["4weken"] + ')</label>' +
          '<label><input type="radio" name="qaAddon" value="8weken"> ' + escapeHtml(QA_ADDON_LABELS_JS["8weken"]) + ' (+€' + QA_ADDON_PRICES_JS["8weken"] + ')</label>' +
          '<div class="qa-addon-total">Totaal: €<span id="qaAddonTotalPrice">' + basePrice + '</span></div>' +

            '<input type="text" id="leadPromoCode" placeholder="Testcode" style="padding:9px 12px;border-radius:8px;border:1px solid var(--border);font-size:13px;width:100%;box-sizing:border-box;">' +
            '<div style="font-size:11px;color:#889;margin-top:4px;">Geldig voor het digitale rapport — geeft het rapport gratis vrij plus 1 dag AI-Q&A-toegang.</div>' +
          '</div>' +
        '</div>' +
        '<label style="display:flex;gap:8px;align-items:flex-start;font-size:12px;color:#556;line-height:1.4;margin-bottom:12px;cursor:pointer;">' +
          '<input type="checkbox" id="leadConsent" style="margin-top:2px;flex-shrink:0;">' +
          '<span>Ik geef Zenpertise toestemming om mijn naam, e-mailadres' + (path === "consult" ? " en GSM-nummer" : "") + ' te gebruiken om mij het scanrapport te bezorgen' +
          (path === "consult" ? " en telefonisch contact op te nemen" : "") + '. Zie onze privacyverklaring voor meer info.</span>' +
        '</label>' +
        '<button id="leadSubmitBtn" style="background:var(--primary);color:white;border:none;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;">Versturen</button>' +

    const totalPriceEl = document.getElementById("qaAddonTotalPrice");

        totalPriceEl.textContent = basePrice + addonPrice;
      });

    const promoToggleLink = document.getElementById("promoToggleLink");
    const promoCodeWrap = document.getElementById("promoCodeWrap");
    if (promoToggleLink && promoCodeWrap) {
      promoToggleLink.addEventListener("click", (e) => {
        e.preventDefault();
        const isHidden = promoCodeWrap.style.display === "none";
        promoCodeWrap.style.display = isHidden ? "block" : "none";
        if (isHidden) document.getElementById("leadPromoCode").focus();

  // Stuurt naam/e-mail/telefoon + scores + antwoorden naar de backend. Die genereert de PDF en
  // verstuurt de twee mails (aanvrager + info@danyuzen.com). Zonder BACKEND_URL (offline-modus)
  // tonen we enkel een bevestigingstekst zonder iets te versturen — consistent met de andere
  // functies in dit bestand die netjes terugvallen als er geen live server is.
  async function submitLead() {
    const naamEl = document.getElementById("leadNaam");
    const emailEl = document.getElementById("leadEmail");
    const telefoonEl = document.getElementById("leadTelefoon");
    const consentEl = document.getElementById("leadConsent");
    const statusEl = document.getElementById("leadSubmitStatus");
    const btn = document.getElementById("leadSubmitBtn");
    if (!naamEl || !emailEl || !statusEl || !btn) return;

    const naam = naamEl.value.trim();
    const email = emailEl.value.trim();
    const telefoon = telefoonEl.value.trim();

    if (!naam || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      statusEl.textContent = "Vul minstens je naam en een geldig e-mailadres in.";
      statusEl.style.color = "var(--red)";
      return;
    }

    if (!consentEl || !consentEl.checked) {
      statusEl.textContent = "Vink het toestemmingsvakje aan om verder te gaan.";
      statusEl.style.color = "var(--red)";
      return;
    }

    const nextStepText = chosenPath === "consult"
      ? "Een Zenpertise-adviseur neemt binnen 2 werkdagen contact op."
      : "Over 8 weken sturen we automatisch een nieuwe scan.";

    if (!BACKEND_URL) {
      statusEl.textContent = "Genoteerd. " + nextStepText + " (offline-modus — geen live server geconfigureerd, er is dus geen mail verstuurd.)";
      statusEl.style.color = "#234f42";
      naamEl.disabled = emailEl.disabled = telefoonEl.disabled = true;
      btn.style.display = "none";
      return;
    }

    btn.disabled = true;
    statusEl.textContent = "Bezig met versturen...";
    statusEl.style.color = "#556";

    const scoresObj = {};
    BSC.forEach((persp) => { scoresObj[persp.label] = perspectiveScore(persp); });
    const qaAddonEl = document.querySelector('input[name="qaAddon"]:checked');
    const qaAddonValue = (qaAddonEl && qaAddonEl.value) || "";
    const leadPayload = {
      sector: SECTORS[currentSector].name,
      path: chosenPath,
      naam: naam,
      email: email,
      telefoon: telefoon || null,
      scan_scores: scoresObj,
      scan_answers: answeredQaList(),
      qa_addon: qaAddonValue || null,
    };

    // Gratis testcode: als er iets is ingevuld, gaan we NIET naar Mollie of het manuele fallback-
    // pad — we roepen rechtstreeks /api/redeem-promo aan. Enkel geldig voor het digitale rapport
    // (de server controleert dit ook, dit is puur een snellere client-side check).
    const promoCodeEl = document.getElementById("leadPromoCode");
    const promoCode = (promoCodeEl && promoCodeEl.value.trim()) || "";
    if (promoCode) {
      if (chosenPath !== "digital") {
        statusEl.textContent = "De gratis testcode geldt enkel voor het digitale rapport.";
        statusEl.style.color = "var(--red)";
        btn.disabled = false;
        return;
      }
      try {
        const res = await fetch(BACKEND_URL + "/api/redeem-promo", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(Object.assign({}, leadPayload, { promo_code: promoCode })),
        });
        if (!res.ok) {
          const errBody = await res.json().catch(() => ({}));
          throw new Error(errBody.detail || ("Serverfout (" + res.status + ")"));
        }
        const data = await res.json();
        statusEl.textContent = "Testcode toegepast — je ontvangt het rapport gratis per mail, met 1 dag AI-Q&A-toegang.";
        statusEl.style.color = "#234f42";

        // Rechtstreekse link naar het feedbackformulier (feedback.html leeft naast dit bestand in
        // dezelfde repo/site) — naam/e-mail/sector alvast ingevuld zodat de tester niet opnieuw
        // hoeft te typen. Staat ook al in de bevestigingsmail, maar hier is 'm meteen zichtbaar.
        const fbLink = document.createElement("a");
        fbLink.href = "feedback.html?naam=" + encodeURIComponent(naam) + "&email=" + encodeURIComponent(email) + "&sector=" + encodeURIComponent(SECTORS[currentSector].name);
        fbLink.target = "_blank";
        fbLink.rel = "noopener";
        fbLink.textContent = "Laat je bevindingen achter (2 min)";
        fbLink.style.cssText = "display:inline-block;margin-top:10px;background:var(--primary);color:white;border-radius:8px;padding:9px 14px;font-size:13px;text-decoration:none;font-weight:600;";
        statusEl.appendChild(document.createElement("br"));
        statusEl.appendChild(fbLink);

        if (data.whatsapp_number || whatsappNumber) {
          const number = data.whatsapp_number || whatsappNumber;
          const waMessage = "Nieuwe Zenpertise Quick Scan-testaanvraag (gratis code): " + naam + " (" + SECTORS[currentSector].name + "praktijk). Contact: " + email + (telefoon ? ", " + telefoon : "") + ".";
          const waLink = document.createElement("a");
          waLink.href = "https://wa.me/" + number + "?text=" + encodeURIComponent(waMessage);
          waLink.target = "_blank";
          waLink.rel = "noopener";
          waLink.textContent = "Meld dit ook via WhatsApp";
          waLink.style.cssText = "display:inline-block;margin-top:10px;background:#25D366;color:white;border-radius:8px;padding:9px 14px;font-size:13px;text-decoration:none;font-weight:600;";
          statusEl.appendChild(document.createElement("br"));
          statusEl.appendChild(waLink);
        }
        naamEl.disabled = emailEl.disabled = telefoonEl.disabled = true;
        btn.style.display = "none";
      } catch (err) {
        statusEl.textContent = "Testcode mislukt (" + err.message + ").";
        statusEl.style.color = "var(--red)";
        btn.disabled = false;
      }
      return;
    }

    // Online betalen (Mollie), indien de server dat heeft ingesteld: stuurt de klant naar een
    // beveiligde Mollie-checkoutpagina. Het rapport wordt pas gegenereerd en gemaild zodra de
    // betaling effectief bevestigd is (via de backend-webhook) — niet al bij het klikken hier.
    if (paymentConfigured) {
      try {
        const res = await fetch(BACKEND_URL + "/api/create-payment", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(leadPayload),
        });
        if (!res.ok) throw new Error("Serverfout (" + res.status + ")");
        const data = await res.json();
        if (!data.checkout_url) throw new Error("geen checkout-URL ontvangen");
        statusEl.textContent = "Je wordt doorgestuurd naar de betaalpagina...";
        statusEl.style.color = "#234f42";
        window.location.href = data.checkout_url;
        return; // pagina navigeert weg, verder script hieronder is niet meer relevant
      } catch (err) {
        // Val terug op het manuele pad hieronder i.p.v. de gebruiker vast te laten lopen.
        statusEl.textContent = "Online betalen lukte niet (" + err.message + ") — we sturen je gegevens toch door, je ontvangt het rapport per mail.";
        statusEl.style.color = "#556";
      }
    }

    // Manueel/fallback-pad: rapport meteen vrijgeven, betaling regelt Zenpertise achteraf. Dit is
    // ook het pad dat gebruikt wordt als online betalen (nog) niet is ingesteld op de server.
    try {
      const res = await fetch(BACKEND_URL + "/api/submit-lead", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(leadPayload),
      });
      if (!res.ok) throw new Error("Serverfout (" + res.status + ")");
      const data = await res.json();

      statusEl.textContent = "Aanvraag genoteerd — je ontvangt het rapport per mail. " + nextStepText;
      statusEl.style.color = "#234f42";

      if (data.whatsapp_number || whatsappNumber) {
        const number = data.whatsapp_number || whatsappNumber;
        const waMessage = "Nieuwe Zenpertise Quick Scan-aanvraag: " + naam + " (" + SECTORS[currentSector].name + "praktijk), pad: " +
          (chosenPath === "consult" ? "Begeleidingstraject" : "Zelfstandig + herscan") + ". Contact: " + email + (telefoon ? ", " + telefoon : "") + ".";
        const waLink = document.createElement("a");
        waLink.href = "https://wa.me/" + number + "?text=" + encodeURIComponent(waMessage);
        waLink.target = "_blank";
        waLink.rel = "noopener";
        waLink.textContent = "Meld dit ook via WhatsApp";
        waLink.style.cssText = "display:inline-block;margin-top:10px;background:#25D366;color:white;border-radius:8px;padding:9px 14px;font-size:13px;text-decoration:none;font-weight:600;";
        statusEl.appendChild(document.createElement("br"));
        statusEl.appendChild(waLink);
      }

      naamEl.disabled = emailEl.disabled = telefoonEl.disabled = true;
      btn.style.display = "none";
    } catch (err) {
      statusEl.textContent = "Versturen mislukt (" + err.message + "). Probeer opnieuw, of neem rechtstreeks contact op.";
      statusEl.style.color = "var(--red)";
      btn.disabled = false;
    }
  }

  function reset() {
    currentSector = null;
    lastPerspective = null;
    if (ttsSupported) window.speechSynthesis.cancel();
    reportArea.style.display = "none";
    sectorPicker.style.display = "flex";
    headerSub.textContent = "Kies je praktijktype om te starten — 15 vragen, 4 minuten.";
  }

  // Toont na een redirect terug van de Mollie-checkout (redirectUrl bevat ?paid=1) een
  // bevestigingsscherm i.p.v. de gewone scanflow. LET OP: Mollie stuurt de klant ALTIJD terug naar
  // redirectUrl na de checkoutpagina — ook bij annuleren, mislukken, of gewoon teruggaan zonder te
  // betalen. "?paid=1" alleen betekent dus NIET dat er effectief betaald is. Daarom vragen we via
  // /api/payment-status (gekoppeld aan de "ref"-parameter die create-payment meestuurt) de echte
  // status op vóór we een bevestiging tonen — zie checkPaymentStatusAndRender() hieronder.
  function renderPaymentScreen(state) {
    sectorPicker.style.display = "none";
    chatArea.style.display = "none";
    reportArea.style.display = "block";

    const COPY = {
      checking: {
        title: "Even geduld...",
        body: "We controleren de status van je betaling.",
      },
      paid: {
        title: "Bedankt voor je betaling!",
        body: "Je Zenpertise Quick Scan-rapport wordt nu automatisch per mail verstuurd — dit duurt meestal maar enkele seconden. Zie je na een kwartier nog niets (check ook je spamfolder)? Neem dan gerust rechtstreeks contact met ons op.",
      },
      pending: {
        title: "We wachten nog op bevestiging",
        body: "Je betaling is nog niet bevestigd door Mollie. Dat kan bij sommige betaalmethodes iets langer duren. Herlaad deze pagina straks opnieuw — zodra de bevestiging binnen is, sturen we je rapport automatisch per mail. Zie je na een kwartier nog niets? Neem dan gerust rechtstreeks contact met ons op.",
      },
      failed: {
        title: "Betaling niet voltooid",
        body: "Je betaling is niet gelukt, geannuleerd, of je bent teruggekeerd zonder te betalen — er is niets afgeschreven en er is dus ook geen rapport verstuurd. Wil je het opnieuw proberen?",
      },
      unknown: {
        title: "Status onbekend",
        body: "We konden de status van deze betaling niet terugvinden (bv. een verlopen link). Heb je wél betaald maar zie je hier geen bevestiging, neem dan rechtstreeks contact met ons op — anders kan je hieronder gewoon opnieuw starten.",
      },
    };
    const c = COPY[state] || COPY.unknown;

    reportArea.innerHTML =
      '<div class="path-confirm" style="margin:20px;">' +
        '<div style="font-weight:700;margin-bottom:8px;font-size:15px;">' + escapeHtml(c.title) + '</div>' +
        '<p style="font-size:13px;color:#556;line-height:1.6;margin:0;">' + escapeHtml(c.body) + '</p>' +
      '</div>';

    if (state !== "checking") {
      const restartBtn = document.createElement("button");
      restartBtn.className = "restart-btn";
      restartBtn.style.margin = "0 20px 20px";
      restartBtn.textContent = state === "failed" ? "← Opnieuw proberen" : "← Nieuwe scan starten";
      restartBtn.onclick = reset;
      reportArea.appendChild(restartBtn);
    }

    headerSub.textContent =
      state === "paid" ? "Bedankt — je rapport is onderweg." :
      state === "failed" ? "Betaling niet voltooid." :
      state === "pending" ? "Nog geen bevestiging ontvangen." :
      "Status wordt gecontroleerd...";
  }

  // Vraagt de echte betaalstatus op bij de backend (gekoppeld aan de "ref"-parameter) en toont
  // pas dan het juiste scherm. Zonder geldige ref (oude links, of BACKEND_URL niet ingesteld)
  // vallen we terug op de oude, voorzichtige "pending"-boodschap i.p.v. blind "betaald" te tonen.
  async function checkPaymentStatusAndRender(ref) {
    if (!ref || !BACKEND_URL) {
      renderPaymentScreen("pending");
      return;
    }
    renderPaymentScreen("checking");
    const maxAttempts = 8; // ~16s, ruim boven de "meestal enkele seconden" die de webhook nodig heeft
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      try {
        const res = await fetch(BACKEND_URL + "/api/payment-status?ref=" + encodeURIComponent(ref));
        if (res.ok) {
          const data = await res.json();
          if (data.status === "paid" || data.status === "failed" || data.status === "unknown") {
            renderPaymentScreen(data.status);
            return;
          }
          // status "pending": nog even opnieuw proberen hieronder
        }
      } catch (e) {
        // netwerkfout — gewoon opnieuw proberen tot maxAttempts bereikt is
      }
      await new Promise((resolve) => setTimeout(resolve, 2000));
    }
    renderPaymentScreen("pending");
  }

  // Magic-link-terugkeer voor de AI-Q&A-add-on (?token=...): geen login nodig, het token uit de
  // link ZELF is het bewijs van toegang. Vraagt /api/qa-access op om te controleren of het token nog
  // geldig is en om meteen de opgeslagen scan-context terug te krijgen — zonder de scan opnieuw te
  // doorlopen. Bewust los van renderReport()/setupAiQaPanel() (die horen bij de live scan-sessie
  // zelf, met currentSector/perspScores die hier niet bestaan) om die bestaande flow niet complexer
  // te maken voor dit aparte, eenvoudigere geval.
  async function renderQaReturnScreen(token) {
    sectorPicker.style.display = "none";
    chatArea.style.display = "none";
    reportArea.style.display = "block";
    reportArea.innerHTML = '<div class="path-confirm" style="margin:20px;">Toegang wordt gecontroleerd...</div>';
    headerSub.textContent = "AI-Q&A-toegang wordt gecontroleerd...";

    if (!BACKEND_URL) {
      renderQaReturnExpired("Deze functie is nu niet beschikbaar (geen live server geconfigureerd).");
      return;
    }

    try {
      const res = await fetch(BACKEND_URL + "/api/qa-access?token=" + encodeURIComponent(token));
      if (!res.ok) throw new Error("Serverfout (" + res.status + ")");
      const data = await res.json();
      if (!data.valid) {
        renderQaReturnExpired("Deze AI-Q&A-toegangslink is niet (meer) geldig — mogelijk is de toegangsperiode verlopen.");
        return;
      }

      const daysLeft = data.expires_at
        ? Math.max(0, Math.ceil((new Date(data.expires_at) - new Date()) / (1000 * 60 * 60 * 24)))
        : null;

      reportArea.innerHTML =
        '<div class="report">' +
          '<h2>Welkom terug' + (data.naam ? ", " + escapeHtml(data.naam) : "") + '</h2>' +
          '<div class="sub">' + escapeHtml(data.sector || "") + 'praktijk' +
          (daysLeft !== null ? ' &middot; nog ' + daysLeft + ' dag' + (daysLeft === 1 ? "" : "en") + ' toegang' : '') +
          '</div>' +
          '<div class="path-confirm" style="margin-top:14px;">Je AI-adviseur staat voor je klaar — klik rechtsonder op het chatpictogram om te starten.</div>' +
        '</div>';
      headerSub.textContent = "Stel je vraag aan de AI-adviseur.";

      // Chat opent als los pop-upscherm (zie .qa-fab/.qa-popup-* hierboven) i.p.v. ingebed in de
      // pagina — enkel voor deze betaalde, post-scan terugkeer-flow. data.naam komt rechtstreeks
      // uit het opgeslagen qa-access-record (zie /api/qa-access in main.py), dus de begroeting
      // spreekt altijd de juiste persoon aan, ook na een browser-herstart via de magic link.
      openQaPopup(token, data.naam || "");

      const restartBtn = document.createElement("button");
      restartBtn.className = "restart-btn";
      restartBtn.style.margin = "0 20px 20px";
      restartBtn.textContent = "← Nieuwe scan starten";
      restartBtn.onclick = () => { window.location.href = window.location.pathname; };
      reportArea.appendChild(restartBtn);
    } catch (err) {
      renderQaReturnExpired("Kon je toegang niet controleren (" + err.message + "). Probeer de link straks opnieuw.");
    }
  }

  function renderQaReturnExpired(message) {
    reportArea.innerHTML =
      '<div class="path-confirm" style="margin:20px;">' +
        '<div style="font-weight:700;margin-bottom:8px;">' + escapeHtml(message) + '</div>' +
        '<p style="font-size:13px;color:#556;line-height:1.6;margin:0;">Neem gerust rechtstreeks contact met ons op als je nog vragen hebt.</p>' +
      '</div>';
    const restartBtn = document.createElement("button");
    restartBtn.className = "restart-btn";
    restartBtn.style.margin = "0 20px 20px";
    restartBtn.textContent = "← Naar de Quick Scan";
    restartBtn.onclick = () => { window.location.href = window.location.pathname; };
    reportArea.appendChild(restartBtn);
    headerSub.textContent = "Toegangslink niet geldig.";
  }

  // AI-Q&A pop-up — betaalde, post-scan terugkeer-flow (magic link). Zelfde backend-aanroep als
  // de gratis proefsessie tijdens de scan (setupAiQaPanel hierboven, ongewijzigd), maar dan als
  // los scherm i.p.v. ingebed in de pagina: een vaste knop rechtsonder (.qa-fab) opent een
  // overlay (.qa-popup-overlay) met de vertrouwde chat-bubbelstructuur — eigen merkkleuren, geen
  // WhatsApp-branding. De DOM wordt één keer aangemaakt (buildQaPopup) en blijft daarna gewoon
  // open/dicht geplooid, zodat de gespreksgeschiedenis intact blijft bij sluiten/heropenen.
  let aiQaReturnHistory = [];
  let qaPopupBuilt = false;
  let qaPopupWelcomed = false;

  // Voor het avatar-rondje in de popup-header: initialen uit de voornaam + (indien aanwezig)
  // laatste naamdeel, bv. "Danny Currinckx" -> "DC". Geen naam bekend -> "Z" (Zenpertise) als
  // nette fallback i.p.v. een leeg rondje.
  function qaInitials(naam) {
    const parts = (naam || "").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "Z";
    const first = parts[0][0] || "";
    const last = parts.length > 1 ? (parts[parts.length - 1][0] || "") : "";
    return (first + last).toUpperCase();
  }

  function buildQaPopup(naam) {
    if (qaPopupBuilt) return;
    qaPopupBuilt = true;

    const fab = document.createElement("button");
    fab.id = "qaFab";
    fab.className = "qa-fab";
    fab.type = "button";
    fab.title = "Open AI-adviseur";
    fab.setAttribute("aria-label", "Open AI-adviseur chat");
    fab.textContent = "💬";
    document.body.appendChild(fab);

    const overlay = document.createElement("div");
    overlay.id = "qaPopupOverlay";
    overlay.className = "qa-popup-overlay";
    overlay.innerHTML =
      '<div class="qa-popup">' +
        '<div class="qa-popup-header">' +
          '<div class="qa-popup-avatar" id="qaPopupAvatar">' + escapeHtml(qaInitials(naam)) + '</div>' +
          '<div class="qa-popup-header-text">' +
            '<div class="name">Zenpertise AI-adviseur</div>' +
            '<div class="status"><span class="dot"></span><span>Actief</span></div>' +
          '</div>' +
          '<button class="qa-popup-close" id="qaPopupClose" type="button" aria-label="Sluiten">✕</button>' +
        '</div>' +
        '<div class="qa-popup-disclosure">⚠️ Je chat hier met een AI-systeem (aangedreven door Claude van Anthropic), ' +
        'niet met een medewerker van Zenpertise. Antwoorden worden automatisch gegenereerd, kunnen fouten bevatten ' +
        'en vormen geen fiscaal, medisch of juridisch advies. Voer hier geen patiëntgegevens, medische dossiers of ' +
        'andere gevoelige persoonsgegevens in.</div>' +
        '<div class="qa-popup-canvas" id="qaPopupCanvas"></div>' +
        '<div class="qa-popup-input-row">' +
          '<input type="text" id="qaPopupInput" placeholder="Typ je vraag...">' +
          '<button id="qaPopupSendBtn">Verstuur</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);

    fab.addEventListener("click", () => toggleQaPopup(true));
    document.getElementById("qaPopupClose").addEventListener("click", () => toggleQaPopup(false));
    overlay.addEventListener("click", (e) => { if (e.target === overlay) toggleQaPopup(false); });
  }

  function toggleQaPopup(open) {
    const overlay = document.getElementById("qaPopupOverlay");
    if (!overlay) return;
    overlay.classList.toggle("open", open);
    if (open) {
      const inputEl = document.getElementById("qaPopupInput");
      if (inputEl) inputEl.focus();
    }
  }

  function addQaPopupMsg(text, cls) {
    const canvas = document.getElementById("qaPopupCanvas");
    if (!canvas) return;
    const div = document.createElement("div");
    div.className = "qa-popup-msg " + cls;
    div.textContent = text;
    canvas.appendChild(div);
    canvas.scrollTop = canvas.scrollHeight;
  }

  // Bouwt (indien nodig) de popup, toont een eenmalige, gepersonaliseerde begroeting met de
  // voornaam uit data.naam, bindt de verstuur-events, en opent meteen — zodat wie via de magic
  // link terugkeert direct in gesprek kan, zonder eerst zelf de knop te moeten vinden.
  function openQaPopup(token, naam) {
    buildQaPopup(naam);

    if (!qaPopupWelcomed) {
      qaPopupWelcomed = true;
      const greetName = naam ? naam.split(/\s+/)[0] : "";
      addQaPopupMsg(
        (greetName ? "Hoi " + greetName + "! 👋 " : "Hoi! 👋 ") +
        "Waarmee kan ik je helpen vandaag? Stel gerust een vraag over je scanresultaten of de toolkit.",
        "bot"
      );
    }

    const inputEl = document.getElementById("qaPopupInput");
    const sendBtn = document.getElementById("qaPopupSendBtn");
    if (inputEl && !inputEl.dataset.bound) {
      inputEl.dataset.bound = "1";
      inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") sendQaPopupMessage(token); });
    }
    if (sendBtn && !sendBtn.dataset.bound) {
      sendBtn.dataset.bound = "1";
      sendBtn.addEventListener("click", () => sendQaPopupMessage(token));
    }

    toggleQaPopup(true);
  }

  // Zelfde backend-aanroep als setupAiQaPanel() tijdens de live scan-sessie, maar dan voor een
  // terugkerend bezoek via de magic link: stuurt enkel het token mee (geen scores/antwoorden vanuit
  // deze pagina-sessie, die bestaan hier niet) — de backend haalt de opgeslagen scan-context zelf op
  // aan de hand van het token (zie /api/qa-access in main.py).
  async function sendQaPopupMessage(token) {
    const inputEl = document.getElementById("qaPopupInput");
    const sendBtn = document.getElementById("qaPopupSendBtn");
    if (!inputEl || !sendBtn) return;
    const text = inputEl.value.trim();
    if (!text) return;
    addQaPopupMsg(text, "user");
    aiQaReturnHistory.push({ role: "user", content: text });
    inputEl.value = "";
    sendBtn.disabled = true;

    try {
      const res = await fetch(BACKEND_URL + "/api/qa", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          sector: "",
          history: aiQaReturnHistory.slice(0, -1),
          message: text,
          token: token,
        }),
      });
      if (!res.ok) throw new Error("Serverfout (" + res.status + ")");
      const data = await res.json();
      addQaPopupMsg(data.reply, "bot");
      aiQaReturnHistory.push({ role: "assistant", content: data.reply });
      if (data.expired) {
        inputEl.disabled = true;
        sendBtn.disabled = true;
      }
    } catch (err) {
      addQaPopupMsg("Er ging iets mis bij het ophalen van een antwoord (" + err.message + "). Probeer het later opnieuw.", "bot");
    } finally {
      if (!inputEl.disabled) sendBtn.disabled = false;
    }
  }

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str || "";
    return d.innerHTML;
  }

  // Spraakinvoer — alternatief voor typen, via de Web Speech API. Werkt in Chrome/
  // Edge/Safari (webkit-prefix); Firefox desktop ondersteunt dit nog niet, dan
  // verbergen we de microfoonknop gewoon en blijft typen de enige weg.
  function setupSpeechInput() {
    const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognitionCtor) {
      micBtn.style.display = "none";
      return;
    }

    const recognition = new SpeechRecognitionCtor();
    recognition.lang = "nl-BE";
    recognition.continuous = false;
    recognition.interimResults = true;
    let isListening = false;

    function showHint(text) {
      micHint.textContent = text;
      micHint.style.display = text ? "block" : "none";
    }

    function stopListeningUi() {
      isListening = false;
      micBtn.classList.remove("listening");
      micBtn.textContent = "🎤";
      micBtn.title = "Spreek je antwoord in";
    }

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add("listening");
      micBtn.textContent = "⏹";
      micBtn.title = "Stop met luisteren";
      showHint("Aan het luisteren... spreek je antwoord in.");
    };

    recognition.onresult = (event) => {
      let transcript = "";
      for (let i = 0; i < event.results.length; i++) transcript += event.results[i][0].transcript;
      inputEl.value = transcript;
    };

    recognition.onerror = (event) => {
      stopListeningUi();
      if (event.error === "not-allowed" || event.error === "service-not-allowed") {
        showHint("Microfoontoegang geweigerd — sta microfoongebruik toe in je browser om spraakinvoer te gebruiken.");
      } else if (event.error === "no-speech") {
        showHint("Niets gehoord — probeer opnieuw of typ je antwoord.");
      } else {
        showHint("Spraakherkenning niet gelukt — typ je antwoord gerust.");
      }
    };

    recognition.onend = () => {
      stopListeningUi();
      if (inputEl.value.trim()) {
        showHint("Herkend — controleer en klik op Verstuur (of pas het gerust aan).");
        inputEl.focus();
      } else {
        showHint("");
      }
    };

    micBtn.addEventListener("click", () => {
      if (isListening) {
        recognition.stop();
        return;
      }
      if (ttsSupported) window.speechSynthesis.cancel(); // voorkom dat de mic de eigen bot-stem opvangt
      inputEl.value = "";
      showHint("");
      try { recognition.start(); } catch (e) { /* al gestart, negeren */ }
    });
  }

  sendBtn.addEventListener("click", () => handleAnswer(inputEl.value));
  inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") handleAnswer(inputEl.value); });

  setupSpeechInput();

  // --- Toegangscode-vergrendeling -------------------------------------------------
  // De tool is nog niet voor het grote publiek bedoeld. Bezoekers moeten eerst de
  // toegangscode invoeren die Zenpertise met geselecteerde testpersonen deelt.
  // Puur client-side (geen gevoelige data achter dit slot) — voldoende om te
  // voorkomen dat toevallige bezoekers de scan starten, niet waterdicht.
  const ACCESS_CODE = "ZEN2026";
  const ACCESS_STORAGE_KEY = "zenpertise_qs_unlocked";
  const accessGateEl = document.getElementById("accessGate");
  const appRootEl = document.getElementById("appRoot");
  const accessCodeInput = document.getElementById("accessCodeInput");
  const accessCodeBtn = document.getElementById("accessCodeBtn");
  const accessCodeError = document.getElementById("accessCodeError");

  function bootApp() {
    const params = new URLSearchParams(window.location.search);
    if (params.get("paid") === "1") {
      checkPaymentStatusAndRender(params.get("ref"));
    } else {
      renderSectorPicker();
    }
  }

  function unlockApp() {
    try { sessionStorage.setItem(ACCESS_STORAGE_KEY, "1"); } catch (e) { /* privémodus etc. — negeren */ }
    accessGateEl.style.display = "none";
    appRootEl.style.display = "block";
    bootApp();
  }

  function tryUnlock() {
    const entered = (accessCodeInput.value || "").trim().toUpperCase();
    if (entered === ACCESS_CODE) {
      unlockApp();
    } else {
      accessCodeError.style.display = "block";
      accessCodeInput.value = "";
      accessCodeInput.focus();
    }
  }

  accessCodeBtn.addEventListener("click", tryUnlock);
  accessCodeInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });

  // AI-Q&A-add-on magic link (?token=...): het token zelf is het bewijs van (betaalde) toegang, dus
  // een klant die zo terugkeert slaat zowel de scan als de ZEN2026-toegangscode hierboven over —
  // anders zou een betalende klant alsnog het codewoord nodig hebben om bij zijn eigen chat te
  // komen. Deze check loopt daarom vóór de gewone gate-logica.
  const qaReturnToken = new URLSearchParams(window.location.search).get("token");
  if (qaReturnToken) {
    accessGateEl.style.display = "none";
    appRootEl.style.display = "block";
    renderQaReturnScreen(qaReturnToken);
  } else {
    let alreadyUnlocked = false;
    try { alreadyUnlocked = sessionStorage.getItem(ACCESS_STORAGE_KEY) === "1"; } catch (e) { /* negeren */ }
    if (alreadyUnlocked) {
      unlockApp();
    } else {
      accessCodeInput.focus();
    }
  }
})();
</script>
</body>
</html>
